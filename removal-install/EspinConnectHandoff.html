<!DOCTYPE html>
<html lang="en">
<head>
  <script src="operation-context.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Creating Espin Connect Project</title>
  <style>
    :root{
      --blue:#0066B2;
      --green:#2e7d32;
      --red:#b00020;
      --light:#f8f9fa;
      --text:#17202a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--light);
      color:var(--text);
    }
    .card{
      width:min(560px,100%);
      padding:28px;
      border-radius:18px;
      background:#fff;
      border:1px solid #e5e7eb;
      box-shadow:0 18px 50px rgba(0,0,0,.10);
    }
    h1{margin:0 0 12px;font-size:27px;color:var(--blue)}
    p{font-size:17px;line-height:1.5;margin:8px 0}
    .spinner{
      width:42px;height:42px;margin:22px auto;
      border:5px solid #dce7f1;border-top-color:var(--blue);
      border-radius:50%;animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .error h1{color:var(--red)}
    .success h1{color:var(--green)}
    button{
      width:100%;margin-top:16px;padding:14px;
      border:0;border-radius:12px;background:var(--blue);
      color:#fff;font-size:16px;font-weight:800;cursor:pointer;
    }
    pre{
      white-space:pre-wrap;overflow-wrap:anywhere;
      padding:12px;border-radius:10px;background:#f3f4f6;
      font-size:12px;color:#333;
    }
  </style>
<link rel="stylesheet" href="field-command-theme.css">
</head>
<body>
  <main class="card" id="card">
    <h1>Opening ESPIN Connect</h1>
    <p id="status">Preparing the equipment workflow.</p>
    <div class="spinner" id="spinner"></div>
    <pre id="details" style="display:none"></pre>
    <button id="retryBtn" style="display:none">Try Again</button>
  </main>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const card = document.getElementById("card");
  const status = document.getElementById("status");
  const spinner = document.getElementById("spinner");
  const details = document.getElementById("details");
  const retryBtn = document.getElementById("retryBtn");

  const clean = value => String(value || "").trim();
  function continueToWorkflow() {
    const storedEmail = clean(
      localStorage.getItem("espinUserEmail") ||
      localStorage.getItem("espinEquipment_userEmail")
    ).toLowerCase();
    const repEmail = clean(
      params.get("sales_rep_email") ||
      storedEmail ||
      "info@espinmedical.com"
    ).toLowerCase();

    localStorage.setItem("espinAuth", "true");
    localStorage.setItem("espinUserEmail", repEmail);

    const requestedType = clean(
      params.get("project_type") ||
      params.get("operation_type") ||
      params.get("selected_type")
    ).toLowerCase();
    const requestedHandoff = clean(params.get("handoff")).toLowerCase();
    const isInstall =
      requestedType === "install" ||
      requestedType === "installation" ||
      requestedHandoff === "installation_project" ||
      requestedHandoff === "install_project";
    const destination = new URL(
      isInstall
        ? "/removal-install/EquipmentSelection_Install.html"
        : "/removal-install/EquipmentSelection_Removal.html",
      location.origin
    );
    params.forEach((value,key) => {
      if (key !== "operation_id" && clean(value)) destination.searchParams.set(key,value);
    });
    status.textContent = isInstall ? "Opening installation equipment selection." : "Opening de-installation equipment selection.";
    setTimeout(() => location.replace(destination.toString()), 300);
  }

  retryBtn.addEventListener("click", continueToWorkflow);
  continueToWorkflow();
})();
</script>
</body>
</html>

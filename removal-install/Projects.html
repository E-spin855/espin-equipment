<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<title>Projects | Espin Medical</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
:root { --blue:#0066B2; --gray:#777; --bg:#f6f6f6; --danger:#d93025; }

html, body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  font-family:Arial,sans-serif;
  background:var(--bg);
  position:fixed;
  width:100%;
}

.header{
  padding:20px;
  font-size:26px;
  font-weight:800;
  color:var(--blue);
}

/* Keep the operation identity strip inside the page layout. */
#espinOperationIdentity{
  width:auto!important;
  max-width:none!important;
  margin:12px 20px 0!important;
  padding:10px 14px!important;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* operation-context.js inserts the strip before the page content. */
#espinOperationIdentity ~ .header{
  padding-top:20px;
}

#espinOperationIdentity ~ .list{
  top:165px;
}

@media (max-width:600px){
  #espinOperationIdentity{
    margin:10px 14px 0!important;
    font-size:12px!important;
  }

  #espinOperationIdentity ~ .list{
    top:158px;
  }
}

.add-project-btn{
  position:fixed;
  top:18px;
  right:18px;
  padding:14px 20px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  z-index:3000;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.list{
  position:absolute;
  top:90px; /* header + spacing */
  bottom:80px; /* nav height */
  left:0;
  right:0;

  padding:0 20px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 6px 16px rgba(0,0,0,.12);
  cursor:pointer;
  position:relative;
  -webkit-tap-highlight-color: transparent;
}

.card.archived { opacity:.75; }

.archived-label{
  background:#eee;
  color:#444;
  font-size:12px;
  font-weight:800;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid #ccc;
}

.card h3.title-inline{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0;
  font-size:20px;
  color:#333;
  padding-right:90px;
  flex-wrap:wrap;
}

.card p{
  margin:6px 0 0;
  color:var(--gray);
  font-size:14px;
}

.add-another-project{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:16px;
  padding:10px 14px;
  border:1px solid #9bbbd2;
  border-radius:10px;
  background:#eef6fc;
  color:var(--blue);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.add-another-project:hover{
  background:#e2f1fb;
}


.badge-wrap{ display:flex; gap:12px; align-items:center; margin-top:4px; }
.badge{
  color:#fff;
  font-size:12px;
  font-weight:800;
  padding:4px 8px;
  border-radius:999px;
  min-width:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--blue);
}

.card-actions{
  position:absolute;
  top:15px; right:15px;
  display:flex; gap:10px;
}
.icon-btn{
  background:#f8f9fa;
  border:1px solid #eee;
  border-radius:8px;
  width:38px; height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
}

/* Modals */
.modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5000;
}
.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:20px;
  padding:24px;
  max-height:90vh;
  overflow-y:auto;
}

.modal-box label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:12px;
  color:#555;
}
.modal-box input,
.modal-box select{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:12px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

.small-note{ font-size:11px; color:var(--blue); font-weight:800; margin-top:6px; }

.primary{
  background:var(--blue);
  color:#fff;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:800;
  cursor:pointer;
  margin-top:20px;
}

.nav{
  position:fixed;
  bottom:0;
  width:100%;

  height:80px;
  padding-bottom:env(safe-area-inset-bottom);

  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-around;

  border-top:1px solid #ddd;
}

.nav a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:var(--gray);
  font-size:12px;
}

.nav a.active{
  color:var(--blue);
  font-weight:800;
}
</style>
</head>

<body>

<div class="header">Projects</div>
<button class="add-project-btn" id="addBtn" onclick="openProjectModal()">ADD PROJECT</button>

<div class="list" id="projectList"></div>

<!-- PROJECT MODAL -->
<div class="modal" id="projectModal">
  <div class="modal-box">
    <h3 id="modalTitle">Add Project</h3>
    <input type="hidden" id="editId">

    <label>Project Name</label>
    <input id="inpName">

    <label>Site Address</label>
    <input id="inpAddress">

    <label>Equipment Type</label>
    <select id="mModality">
      <option value="">Select Modality</option>
      <option value="MRI">MRI</option>

  <a href="Projects.html" class="active">🛠️<br>Projects</a>

<!-- ONLY SCRIPT SECTION CHANGED -->

<script>
const ESPIN_OPERATION_FIELDS = [
  "operation_id","operation_type","project_group_id","facility_id",
  "facility_name","facility","source_record_id","tradein_record_id",
  "equipment_source","make","model","equipment_model","equipment",
  "modality","serial_number","asset_id","dom","status","created_at",
  "created_by","sales_rep_first","sales_rep_last","sales_rep_company",
  "sales_rep_phone","sales_rep_email"
];

const ESPIN_PENDING_PROJECTS_KEY =
  "espin_connect_pending_projects_v1";

function readPendingProjects() {
  try {
    const value = JSON.parse(
      localStorage.getItem(ESPIN_PENDING_PROJECTS_KEY) || "[]"
    );
    return Array.isArray(value) ? value : [];
  } catch (_) {
    return [];
  }
}

function writePendingProjects(records) {
  localStorage.setItem(
    ESPIN_PENDING_PROJECTS_KEY,
    JSON.stringify(Array.isArray(records) ? records : [])
  );
}

function projectIdentity(project) {
  return String(
    project?.id ||
    project?.project_id ||
    project?.projectId ||
    project?.operation_id ||
    project?.source_record_id ||
    ""
  ).trim();
}

function mergeProjectRecord(existing, incoming) {
  if (!existing) return incoming;

  const merged = { ...existing };

  Object.entries(incoming || {}).forEach(([key, value]) => {
    if (
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ) {
      merged[key] = value;
    }
  });

  return merged;
}

let email =
  localStorage.getItem("espinUserEmail") ||
  localStorage.getItem("espinEquipment_userEmail") ||
  "info@espinmedical.com";
email = String(email || "").toLowerCase().trim();
localStorage.setItem("espinAuth", "true");
localStorage.setItem("espinUserEmail", email);

const ADMIN_EMAIL = "info@espinmedical.com";
const isAdmin =
  (email || "").toLowerCase().trim() ===
  (ADMIN_EMAIL || "").toLowerCase().trim();

/* ===============================
   MRI BLOCK LOGIC
=============================== */
function toggleMriBlock(modality) {
  const block = document.getElementById("mriBlock");
  if (!block) return;
  block.style.display = modality === "MRI" ? "block" : "none";
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("addBtn").style.display =
    isAdmin ? "block" : "none";

  document.getElementById("mModality").addEventListener("change", (e) => {
    toggleMriBlock(e.target.value);
  });

  loadProjectsSafe();
});
/* ===============================
   MODAL
=============================== */
function openProjectModal(project = null) {
  document.getElementById("editId").value = project ? project.id : "";
  document.getElementById("inpName").value = project ? project.project_name : "";
  document.getElementById("inpAddress").value = project ? project.site_address : "";
  document.getElementById("inpZip").value = project ? (project.zip_code || "") : "";
  document.getElementById("mModality").value = project ? project.modality : "";
  document.getElementById("mMagnet").value = project ? (project.magnet_event || "") : "";
  document.getElementById("mDisposal").value = project ? String(project.disposal_required ?? false) : "false";

  toggleMriBlock(document.getElementById("mModality").value);

  document.getElementById("modalTitle").innerText = project ? "Edit Project" : "Add New Project";
  document.getElementById("projectModal").style.display = "flex";
}

function closeProjectModal() {
  document.getElementById("projectModal").style.display = "none";
}

/* ===============================
   SAVE
=============================== */
async function saveProject() {
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.innerText = "Saving...";

  const id = document.getElementById("editId").value;
  const modality = document.getElementById("mModality").value;

 const payload = {
  id: id || undefined,
  projectId: id || undefined,

  source: "app",

  project_name: document.getElementById("inpName").value,
  site_address: document.getElementById("inpAddress").value,
  zip_code: document.getElementById("inpZip").value,
  modality: modality,
  magnet_event: modality === "MRI"
    ? document.getElementById("mMagnet").value
    : null,
  disposal_required:
    document.getElementById("mDisposal").value === "true"
};
  try {
    const r = await fetch("/api/removal-install/projects", {
      method: id ? "PUT" : "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": email
      },
      body: JSON.stringify(payload)
    });

    if (r.ok) {
      closeProjectModal();
      setTimeout(loadProjectsSafe, 500);
    } else {
      alert("Save failed.");
    }
  } catch (e) {
    console.error(e);
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Project";
  }
}

/* ===============================
   DELETE
=============================== */
let pendingDeleteId = null;

function showDeleteModal(id) {
  pendingDeleteId = id;
  document.getElementById("deleteModal").style.display = "flex";
}

document.getElementById("deleteCancelBtn").onclick = () => {
  document.getElementById("deleteModal").style.display = "none";
  pendingDeleteId = null;
};

document.getElementById("deleteConfirmBtn").onclick = async () => {
  const button = document.getElementById("deleteConfirmBtn");
  const projectId = pendingDeleteId;

  if (!projectId || button.disabled) return;

  button.disabled = true;
  button.innerText = "Deleting…";

  try {
    const response = await fetch("/api/removal-install/projects", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-user-email": email },
      body: JSON.stringify({ action: "delete", id: projectId })
    });

    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.error || "Project could not be deleted");
    }

    pendingDeleteId = null;
    document.getElementById("deleteModal").style.display = "none";
    await loadProjectsSafe();
  } catch (error) {
    console.error("PROJECT DELETE FAILED:", error);
    alert(error.message || "Project could not be deleted");
  } finally {
    button.disabled = false;
    button.innerText = "Delete";
  }
};

/* ===============================
   LOAD PROJECTS
=============================== */
let loadingProjects = false;
let reloadProjectsPending = false;

async function loadProjectsSafe() {
  if (loadingProjects) {
    reloadProjectsPending = true;
    return;
  }

  do {
    reloadProjectsPending = false;
    loadingProjects = true;

    try {
      await loadProjects();
    } finally {
      loadingProjects = false;
    }
  } while (reloadProjectsPending);
}

async function kvGet(key) {
  try {
    const r = await fetch(`/api/removal-install/kv-get?key=${encodeURIComponent(key)}`, {
      headers: { "x-user-email": email }
    });
    if (!r.ok) return 0;
    const j = await r.json();
    return Number(j?.value) || 0;
  } catch {
    return 0;
  }
}
function senderName(p) {
  return `${p.sales_rep_first || ""} ${p.sales_rep_last || ""}`.trim();
}

function shouldShowFromBlock(p) {
  const source = String(p.source || "").toLowerCase().trim();

  const hasSenderInfo =
    senderName(p) ||
    p.sales_rep_company ||
    p.sales_rep_phone ||
    p.sales_rep_email;

  return ["lifecycle", "axis_demo", "equipment_review"].includes(source) && !!hasSenderInfo;
}
function getConfirmedProjectFromUrl() {
  const params = new URLSearchParams(window.location.search);

  const operationId = params.get("operation_id") || "";
  const projectId =
    params.get("projectId") ||
    params.get("id") ||
    params.get("project_id") ||
    "";

  const hasConfirmedProject =
    Boolean(operationId || projectId) &&
    Boolean(
      params.get("equipment_model") ||
      params.get("model") ||
      params.get("equipment") ||
      params.get("serial_number") ||
      params.get("asset_id")
    );

  if (!hasConfirmedProject) return null;

  const id =
    projectId ||
    operationId ||
    `LOCAL-${Date.now()}`;

  const model =
    params.get("equipment_model") ||
    params.get("model") ||
    params.get("equipment") ||
    "Equipment";

  const operationType =
    params.get("operation_type") ||
    "deinstall";

  return {
    id,
    project_id: projectId || "",
    projectId: projectId || "",
    operation_id: operationId,
    operation_type: operationType,
    project_group_id: params.get("project_group_id") || "",
    parent_project_id: params.get("parent_project_id") || "",
    facility_id: params.get("facility_id") || "",
    facility_name:
      params.get("facility_name") ||
      params.get("facility") ||
      "",
    facility:
      params.get("facility_name") ||
      params.get("facility") ||
      "",
    source_record_id:
      params.get("source_record_id") ||
      params.get("axis_record_id") ||
      "",
    tradein_record_id:
      params.get("tradein_record_id") ||
      "",
    equipment_source:
      params.get("equipment_source") ||
      "rep",
    make: params.get("make") || "",
    model,
    equipment_model: model,
    equipment:
      params.get("equipment") ||
      [params.get("make"), model].filter(Boolean).join(" "),
    modality: params.get("modality") || "OTHER",
    serial_number: params.get("serial_number") || "",
    asset_id: params.get("asset_id") || "",
    dom: params.get("dom") || "",
    status: params.get("status") || "active",
    created_at:
      params.get("created_at") ||
      new Date().toISOString(),
    created_by: params.get("created_by") || "",
    sales_rep_first: params.get("sales_rep_first") || "",
    sales_rep_last: params.get("sales_rep_last") || "",
    sales_rep_company: params.get("sales_rep_company") || "",
    sales_rep_phone: params.get("sales_rep_phone") || "",
    sales_rep_email: params.get("sales_rep_email") || email,
    project_name:
      params.get("project_name") ||
      `${model} · ${
        operationType === "install"
          ? "Installation"
          : "Removal"
      }`,
    site_address: params.get("site_address") || "",
    zip_code: params.get("zip_code") || "",
    disposal_required:
      params.get("disposal_required") === "true",
    magnet_event: params.get("magnet_event") || "",
    source:
      params.get("source") ||
      "espin_link_equipment_intake",
    pending_api_sync: true
  };
}

function storeConfirmedProjectFromUrl() {
  const project = getConfirmedProjectFromUrl();
  if (!project) return null;

  const identity = projectIdentity(project);
  const records = readPendingProjects();
  const index = records.findIndex(
    record => projectIdentity(record) === identity
  );

  if (index >= 0) {
    records[index] = mergeProjectRecord(
      records[index],
      project
    );
  } else {
    records.unshift(project);
  }

  writePendingProjects(records);
  return project;
}

function reconcilePendingProjects(apiProjects) {
  const apiIdentities = new Set(
    apiProjects.map(projectIdentity).filter(Boolean)
  );

  const pending = readPendingProjects().filter(project => {
    const identity = projectIdentity(project);
    return identity && !apiIdentities.has(identity);
  });

  writePendingProjects(pending);
  return pending;
}

async function loadProjects() {
  const list = document.getElementById("projectList");

  try {
    const confirmedProject =
      storeConfirmedProjectFromUrl();

    const currentUrl = new URL(window.location.href);
    const hadProjectHandoff =
      currentUrl.searchParams.has("operation_id") ||
      currentUrl.searchParams.has("projectId") ||
      currentUrl.searchParams.has("id");

    if (
      hadProjectHandoff &&
      currentUrl.searchParams.get("source") !== "axis_demo"
    ) {
      currentUrl.search = "";
      history.replaceState(null, "", currentUrl.toString());
    }
    console.log("Loading projects for:", email);

    const projectsApiUrl = new URL(
        "/api/removal-install/projects",
        window.location.origin
      );
      projectsApiUrl.search = "";

      const r = await fetch(projectsApiUrl.toString(), {
        method: "GET",
      headers: {
        "x-user-email": email
      },
      cache: "no-store"
    });

    const raw = await r.text();

    console.log("PROJECTS STATUS:", r.status);
    console.log("PROJECTS RESPONSE:", raw);

    if (!r.ok) {
      list.innerHTML = `
        <p style="text-align:center;color:red;">
          Failed to load projects.<br>
          Status: ${r.status}
        </p>
      `;
      return;
    }

    let projects = [];

    try {
      const parsed = raw ? JSON.parse(raw) : [];

      if (Array.isArray(parsed)) {
        projects = parsed;
      } else if (parsed && Array.isArray(parsed.projects)) {
        projects = parsed.projects;
      } else if (parsed && Array.isArray(parsed.data)) {
        projects = parsed.data;
      } else if (parsed && Array.isArray(parsed.records)) {
        projects = parsed.records;
      } else if (parsed && typeof parsed === "object") {
        projects = Object.values(parsed).flatMap(value =>
          Array.isArray(value)
            ? value
            : (
                value &&
                typeof value === "object" &&
                (
                  value.id ||
                  value.project_id ||
                  value.projectId ||
                  value.project_name
                )
              )
              ? [value]
              : []
        );
      } else {
        projects = [];
      }
    } catch (e) {
      console.error("Invalid JSON from /api/removal-install/projects:", raw, e);
      list.innerHTML = `<p style="text-align:center;color:red;">Invalid project response.</p>`;
      return;
    }

    projects = projects.filter(project =>
      project && typeof project === "object"
    );

    list.innerHTML = "";

    const seen = new Set();
    projects = projects.filter(project => {
      const projectId = String(
        project.id ||
        project.project_id ||
        project.projectId ||
        project.operation_id ||
        ""
      ).trim();

      if (!projectId) return true;
      if (seen.has(projectId)) return false;

      seen.add(projectId);
      return true;
    });
    projects.sort((a,b) =>
      String(a.project_group_id || a.id).localeCompare(String(b.project_group_id || b.id)) ||
      new Date(b.created_at || 0) - new Date(a.created_at || 0)
    );
    const pendingProjects =
      reconcilePendingProjects(projects);

    const mergedProjects = new Map();

    [...pendingProjects, ...projects].forEach(project => {
      const identity = projectIdentity(project);
      if (!identity) return;

      mergedProjects.set(
        identity,
        mergeProjectRecord(
          mergedProjects.get(identity),
          project
        )
      );
    });

    projects = Array.from(mergedProjects.values());

    for (const p of projects) {
      if (p.hidden) continue;

      const projectId = String(
        p.id ||
        p.project_id ||
        p.projectId ||
        p.operation_id ||
        ""
      ).trim();

      if (!projectId) continue;

      p.id = projectId;

      const [unreadData, unreadImages] = await Promise.all([
        kvGet(`project:unread:${projectId}:${email}`),
        kvGet(`project:unread_images:${projectId}:${email}`)
      ]);

      const card = document.createElement("div");
      card.className =
        "card" +
        (p.project_completed ? " archived" : "");

      if (p.pending_api_sync) {
        card.dataset.pendingSync = "true";
      }

      card.innerHTML = `
        ${isAdmin ? `
          <div class="card-actions">
            <div class="icon-btn" data-edit="${p.id}">✏️</div>
            <div class="icon-btn" data-delete="${p.id}" style="color:var(--danger)">🗑</div>
          </div>
        ` : ``}

        <h3 class="title-inline">
          ${p.project_name || "Unnamed Project"}
          ${p.project_completed ? `<span class="archived-label">🔒 Archived</span>` : ""}
        </h3>

        <div class="badge-wrap">
          ${!p.project_completed && unreadData > 0 ? `<span class="badge">⚡ NEW</span>` : ""}
          ${!p.project_completed && unreadImages > 0 ? `<span class="badge">🖼 NEW</span>` : ""}
          ${p.pending_api_sync ? `<span class="badge">SYNCING</span>` : ""}
        </div>

        <p>${p.site_address || ""} ${p.zip_code || ""}</p>
        <p><strong>Operation:</strong> ${p.operation_type === "install" ? "Install" : "De-install"}</p>
        ${p.project_group_id ? `<p><strong>Related group:</strong> ${p.project_group_id}</p>` : ""}
        <p><strong>Equipment:</strong> ${p.equipment_model || p.model || p.equipment || "N/A"}</p>
        <p><strong>Identifier:</strong> ${p.serial_number ? `S/N ${p.serial_number}` : p.asset_id || "N/A"}</p>
        <p><strong>Facility:</strong> ${p.facility_name || p.facility || "N/A"}</p>
        <p><strong>Modality:</strong> ${p.modality || "N/A"}</p>

        ${!p.project_completed ? `
          <button
            type="button"
            class="add-another-project"
            data-add-another="${p.id}"
          >
            Add another project
          </button>
        ` : ""}

     ${shouldShowFromBlock(p) ? `
  <p style="margin-top:6px;font-size:13px;color:#666;">
    <strong>From:</strong> ${senderName(p)}<br>
    ${p.sales_rep_company ? `${p.sales_rep_company}<br>` : ""}
    ${p.sales_rep_phone ? `📞 ${p.sales_rep_phone}<br>` : ""}
    ${p.sales_rep_email ? `✉️ ${p.sales_rep_email}` : ""}
  </p>
` : ""}
      `;

      card.onclick = () => {
        const destination = new URL("management.html", location.href);
        destination.searchParams.set("id", p.id);
        destination.searchParams.set("projectId", p.id);
        ESPIN_OPERATION_FIELDS.forEach(field => {
          if (p[field]) destination.searchParams.set(field, p[field]);
        });
        location.href = destination.toString();
      };

      const addAnotherProjectButton =
        card.querySelector("[data-add-another]");

      if (addAnotherProjectButton) {
        addAnotherProjectButton.onclick = event => {
          event.stopPropagation();

          const selection = new URL(
            "EquipmentSelection.html",
            location.href
          );

          selection.searchParams.set(
            "handoff",
            "additional_equipment"
          );
          selection.searchParams.set(
            "operation_type",
            p.operation_type || "deinstall"
          );
          selection.searchParams.set(
            "parent_project_id",
            p.parent_project_id ||
            p.project_id ||
            p.projectId ||
            p.id ||
            ""
          );
          selection.searchParams.set(
            "project_group_id",
            p.project_group_id || ""
          );
          selection.searchParams.set(
            "facility_id",
            p.facility_id || ""
          );
          selection.searchParams.set(
            "facility_name",
            p.facility_name ||
            p.facility ||
            ""
          );
          selection.searchParams.set(
            "sales_rep_email",
            p.sales_rep_email || email
          );

          location.href = selection.toString();
        };
      }

      if (isAdmin) {
        card.querySelector('[data-edit]').onclick = (e) => {
          e.stopPropagation();
          openProjectModal(p);
        };

        card.querySelector('[data-delete]').onclick = (e) => {
          e.stopPropagation();
          showDeleteModal(p.id);
        };
      }

      list.appendChild(card);
    }

  } catch (err) {
    console.error("PROJECTS FETCH FAILED:", err);
    list.innerHTML = `
      <p style="text-align:center;color:red;">
        Connection error loading projects.
      </p>
    `;
  }
}
window.addEventListener("focus", loadProjectsSafe);
</script>

</body>
</html>

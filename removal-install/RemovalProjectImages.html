<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script>
/* ===============================
   AUTH + PARAMS
=============================== */
(() => {
  const email = String(
    localStorage.getItem("espinUserEmail") ||
    localStorage.getItem("espinEquipment_userEmail") ||
    "info@espinmedical.com"
  ).toLowerCase().trim();
  localStorage.setItem("espinAuth", "true");
  localStorage.setItem("espinUserEmail", email);
})();

const API_BASE = "";

const userEmail = (localStorage.getItem("espinUserEmail") || "").toLowerCase().trim();

const params = new URLSearchParams(location.search);
const urlProjectId = params.get("id") || params.get("projectId");
if (urlProjectId) localStorage.setItem("activeProjectId", urlProjectId);
const projectId = localStorage.getItem("activeProjectId");

/* ===============================
   NEW PILL (IMAGES) — STABLE
=============================== */
const BADGE_STORAGE_KEY = `new_images_${projectId}`;
const BADGE_KV_KEY = `project:badges_images:${projectId}:${userEmail}`;
let hasClearedBadges = false;

function safeParseArray(value) {
  try {
    const v = typeof value === "string" ? JSON.parse(value) : value;
    return Array.isArray(v) ? v : [];
  } catch {
    return [];
  }
}

function uniqStrings(list) {
  return Array.from(
    new Set((list || []).map(x => String(x).trim()).filter(Boolean))
  );
}

function candidateIds(p) {
  const c = [
    p?.id,
    p?.photoId,
    p?.photo_id,
    p?.uuid,
    p?.image_id,
    p?.imageId,
    p?.photo_uuid
  ]
    .map(v => String(v ?? "").trim())
    .filter(Boolean);

  return Array.from(new Set(c));
}

function getPrimaryId(p) {
  const c = candidateIds(p);
  return c[0] || "";
}

function getActiveBadges() {
  const s = sessionStorage.getItem(BADGE_STORAGE_KEY);
  const l = localStorage.getItem(BADGE_STORAGE_KEY);
  return uniqStrings(safeParseArray(s || l || "[]"));
}

function saveBadgesLocally(list) {
  const arr = uniqStrings(list);
  const json = JSON.stringify(arr);
  sessionStorage.setItem(BADGE_STORAGE_KEY, json);
  localStorage.setItem(BADGE_STORAGE_KEY, json);
}

async function syncBadgesFromKV() {
  try {
    const r = await fetch(
      `${API_BASE}/api/removal-install/kv-get?key=${encodeURIComponent(BADGE_KV_KEY)}`,
      {
        headers: { "x-user-email": userEmail }
      }
    );

    const j = await r.json();
    const val = uniqStrings(safeParseArray(j?.value));
    saveBadgesLocally(val);
    return val;
  } catch {
    return getActiveBadges();
  }
}

async function writeBadgesToKV(list) {
  try {
    const arr = uniqStrings(list);
    await fetch(`${API_BASE}/api/removal-install/kv-set`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": userEmail
      },
      body: JSON.stringify({ key: BADGE_KV_KEY, value: JSON.stringify(arr) })
    });
  } catch {}
}

function clearBadgesOnExit() {
  if (hasClearedBadges) return;
  hasClearedBadges = true;

  sessionStorage.removeItem(BADGE_STORAGE_KEY);
  localStorage.removeItem(BADGE_STORAGE_KEY);

  const payload = JSON.stringify({ key: BADGE_KV_KEY, value: "[]" });
  fetch(`${API_BASE}/api/removal-install/kv-set`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-user-email": userEmail
    },
    body: payload,
    keepalive: true
  }).catch(() => {});
}

function handleBack() {
  clearBadgesOnExit();
  setTimeout(() => {
    location.href = window.EspinOperation.url("management.html");
  }, 100);
}

function isNewForPhoto(p, badgeSet) {
  const ids = candidateIds(p);
  for (const id of ids) {
    if (badgeSet.has(id)) return true;
  }
  return false;
}
</script>

<body>
<div class="page">

<div class="header">
  <div onclick="handleBack()" class="back-arrow">←</div>
  <h1>De-Installation Project Images</h1>
</div>

<div class="container">
  <div id="archiveBanner" class="archived-banner" style="display:none">
    🔒 Archived · Read-only
  </div>

  <div class="section-title">Upload Image</div>
  <div class="upload-card">
    <input id="filePicker" type="file" accept="image/*" hidden>
    <button id="chooseFileBtn" type="button">Choose Image</button>
    <div id="uploadSpinner" class="spinner"></div>
  </div>

  <div id="gallery" class="gallery" style="margin-top:20px;"></div>
</div>

<div class="batch-bar">
  <button id="sendBtn" class="batch-btn" disabled>Send Selected Images</button>
  <button id="deleteBtn" class="batch-btn" disabled>Delete Selected Images</button>
</div>
<!-- PREVIEW MODAL -->
<div id="previewModal" class="preview-modal">
  <div class="preview-close" id="previewClose">✕</div>
  <img id="previewImage" src="" alt="Preview">
</div>
<script>
const CLOUD_NAME = "duljf51bg";
const UPLOAD_PRESET = "espin_unsigned";

const filePicker = document.getElementById("filePicker");
const chooseFileBtn = document.getElementById("chooseFileBtn");
const uploadSpinner = document.getElementById("uploadSpinner");
const gallery = document.getElementById("gallery");
const sendBtn = document.getElementById("sendBtn");
const deleteBtn = document.getElementById("deleteBtn");
/* PREVIEW LOGIC */
const previewModal = document.getElementById("previewModal");
const previewImage = document.getElementById("previewImage");
const previewClose = document.getElementById("previewClose");

function openPreview(src) {
  previewImage.src = src;
  previewModal.classList.add("active");
  document.body.style.overflow = "hidden";
}

function closePreview() {
  previewModal.classList.remove("active");
  previewImage.src = "";
  document.body.style.overflow = "";
}

previewClose.onclick = closePreview;
previewModal.onclick = (e) => {
  if (e.target === previewModal) closePreview();
};
let photos = [];
let selected = new Set(); // stores primary id strings
let uploading = false;
let isArchived = false;

/* ARCHIVE */
async function loadArchiveState() {
  try {
    const r = await fetch(`${API_BASE}/api/removal-install/projects?id=${projectId}`, {
      headers: { "x-user-email": userEmail }
    });
    const p = await r.json();
    isArchived = p?.project_completed === true;
  } catch {
    isArchived = false;
  }
}

function applyArchiveUI() {
  if (!isArchived) return;

  document.getElementById("archiveBanner").style.display = "block";
  chooseFileBtn.disabled = true;
  sendBtn.disabled = true;
  deleteBtn.disabled = true;
}

function updateBatchState() {
  if (isArchived) return;

  const sel = photos.filter(p => selected.has(getPrimaryId(p)));

  sendBtn.disabled = !(sel.length && sel.every(p => (p.photo_title || "").trim()));
  deleteBtn.disabled = sel.length === 0;

  document.querySelectorAll(".card").forEach(card => {
    const id = card.dataset.id;
    const p = photos.find(x => getPrimaryId(x) === id);

    if (selected.has(id) && !(p?.photo_title || "").trim()) {
      card.classList.add("missing-title");
    } else {
      card.classList.remove("missing-title");
    }
  });
}

async function saveMeta(p) {
  if (isArchived) return;
  await fetch(`${API_BASE}/api/removal-install/project-photos/save`, {
    method:"POST",
    headers:{ "Content-Type":"application/json","x-user-email":userEmail },
    body: JSON.stringify({
      photoId: getPrimaryId(p),
      projectId,
      photo_title: p.photo_title,
      photo_comment: p.photo_comment
    })
  });
}

const debouncedSave = ((fn, d=600) => {
  let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), d); };
})(saveMeta);

/* RENDER */
function appendCard(p, badgeSet, forceBadge = false) {
  const pid = getPrimaryId(p);
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = pid;

  const showBadge = forceBadge ? true : isNewForPhoto(p, badgeSet);

  card.innerHTML = `
    ${showBadge ? '<div class="new-badge">NEW</div>' : ''}
    <div class="card-header">
  <input class="image-title-input" type="text" value="${p.photo_title||''}" placeholder="Image Title...(Required)">
</div>
    <img src="${p.photo_url}">
    <div class="card-body">
      <textarea placeholder="Add a comment...">${p.photo_comment||''}</textarea>
    </div>
    <div class="card-footer">
      <input type="checkbox">
      <label>Select (Required)</label>
    </div>`;
const img = card.querySelector("img");
img.style.cursor = "zoom-in";
img.onclick = () => openPreview(p.photo_url);
  const title = card.querySelector("input");
  const note = card.querySelector("textarea");
  const cb = card.querySelector("input[type=checkbox]");

  if (isArchived) {
    title.disabled = true;
    note.disabled = true;
    cb.disabled = true;
  }

  title.oninput = () => {
    p.photo_title = title.value;
    debouncedSave(p);
    updateBatchState();
  };

  note.oninput = () => {
    p.photo_comment = note.value;
    debouncedSave(p);
  };

 cb.onchange = () => {
  cb.checked ? selected.add(pid) : selected.delete(pid);
  updateBatchState();
};

gallery.append(card);
return card;
}
/* UPLOAD */
chooseFileBtn.addEventListener("click", function () {
  if (uploading || isArchived) return;

  // A native click is required to open the browser's file chooser. On phones,
  // this lets the device offer Camera, Photo Library, or Files as available.
  filePicker.click();
});

filePicker.onchange = async () => {
  if (isArchived) return;
  const file = filePicker.files[0];
  if (!file) return;

  uploading = true;
  uploadSpinner.style.display = "block";
  chooseFileBtn.disabled = true;

  try {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);

    const cloud = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
      method:"POST",
      body:fd
    });
    const data = await cloud.json();

    const res = await fetch(`${API_BASE}/api/removal-install/project-photos/save`, {
      method:"POST",
      headers:{ "Content-Type":"application/json","x-user-email":userEmail },
      body: JSON.stringify({ projectId, photo_url:data.secure_url, photo_title:"", photo_comment:"" })
    });

    const out = await res.json();
    const photoId = String(out?.photoId ?? out?.id ?? "").trim();
    if (!photoId) return;

    const cur = getActiveBadges();
    if (!cur.includes(photoId)) cur.push(photoId);
    saveBadgesLocally(cur);
    await writeBadgesToKV(cur);

    const p = { id: photoId, photo_url:data.secure_url, photo_title:"", photo_comment:"" };
    photos.unshift(p);

    const badgeSet = new Set(getActiveBadges());
    const card = appendCard(p, badgeSet, true);
card.remove();
gallery.prepend(card);

    updateBatchState();
  } finally {
    uploading = false;
    uploadSpinner.style.display = "none";
    chooseFileBtn.disabled = false;
    filePicker.value = "";
  }
};

/* SEND */
sendBtn.onclick = async () => {
  if (isArchived || sendBtn.disabled) return;

  const originalText = "Send Selected Images";

  sendBtn.disabled = true;
  sendBtn.innerText = "Sending...";

  try {
    const ids = [...selected];

    for (const id of ids) {
      await fetch(`${API_BASE}/api/removal-install/project-photos/queue`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-user-email": userEmail },
        body: JSON.stringify({ photoId: id, queued: true })
      });
    }

    await fetch(`${API_BASE}/api/removal-install/sandbox-project-photos-email`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-user-email": userEmail },
      body: JSON.stringify({ projectId, photoIds: ids })
    });

    await fetch(`${API_BASE}/api/removal-install/image-tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-user-email": userEmail },
      body: JSON.stringify({ projectId, photoIds: ids })
    });

    selected.clear();
    document.querySelectorAll(".card-footer input[type=checkbox]").forEach(cb => (cb.checked = false));

    // SUCCESS
    sendBtn.innerText = "Sent";

    setTimeout(() => {
      sendBtn.innerText = originalText;
      updateBatchState();
    }, 1200);

  } catch (e) {
    console.error("Send failed:", e);
    sendBtn.innerText = originalText;
    sendBtn.disabled = false;
  }
};

/* DELETE */
deleteBtn.onclick = async () => {
  if (isArchived || !selected.size) return;

  const originalText = "Delete Selected Images";

  deleteBtn.disabled = true;
  deleteBtn.innerText = "Deleting...";

  try {
    const badgeList = getActiveBadges();

    for (const id of [...selected]) {
      await fetch(`${API_BASE}/api/removal-install/project-photos/delete`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-user-email": userEmail },
        body: JSON.stringify({ photoId: id, projectId })
      });

      document.querySelector(`.card[data-id="${id}"]`)?.remove();
      photos = photos.filter(p => getPrimaryId(p) !== id);

      const idx = badgeList.indexOf(id);
      if (idx !== -1) badgeList.splice(idx, 1);
    }

    saveBadgesLocally(badgeList);
    await writeBadgesToKV(badgeList);

    selected.clear();
    updateBatchState();

    // SUCCESS
    deleteBtn.innerText = "Deleted";

    setTimeout(() => {
      deleteBtn.innerText = originalText;
      updateBatchState();
    }, 1200);

  } catch (e) {
    console.error("Delete failed:", e);
    alert("Delete failed. Try again.");

    deleteBtn.innerText = originalText;
    deleteBtn.disabled = false;
  }
};

/* INIT */
(async () => {
  await loadArchiveState();
  applyArchiveUI();

  const kvBadges = await syncBadgesFromKV();
  const badgeSet = new Set(kvBadges);

  const res = await fetch(`${API_BASE}/api/removal-install/project-photos/list?projectId=${projectId}`, {
    headers: { "x-user-email": userEmail }
  });

  photos = (await res.json()) || [];

  photos.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  gallery.innerHTML = "";

  photos.forEach(p => appendCard(p, badgeSet));

  updateBatchState();
})();
</script>

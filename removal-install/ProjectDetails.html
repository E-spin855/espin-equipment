    <script>
const params = new URLSearchParams(window.location.search);

const projectId =
  params.get("projectId") ||
  params.get("id") ||
  localStorage.getItem("activeProjectId");

let userEmail =
  localStorage.getItem("espinUserEmail") ||
  localStorage.getItem("espinEquipment_userEmail") ||
  "info@espinmedical.com";

if (!projectId) {
  location.replace("Projects.html");
}

userEmail = String(userEmail).toLowerCase().trim();
localStorage.setItem("espinAuth", "true");
localStorage.setItem("espinUserEmail", userEmail);

/* PER-USER KEYS */
const BADGE_STORAGE_KEY = `badges_${projectId}`;
const BADGE_KV_KEY = `project:badges_details:${projectId}:${userEmail}`;
const UNREAD_KEY = `project:unread:${projectId}:${userEmail}`;
const UNREAD_IMAGES_KEY = `project:unread_images:${projectId}:${userEmail}`;

/* ---------- HELPERS ---------- */

function normalizeKeys(list) {
  return (list || [])
    .map(v => String(v || "").trim())
    .filter(Boolean);
}

function readBadges() {
  try {
    const raw =
      sessionStorage.getItem(BADGE_STORAGE_KEY) ||
      localStorage.getItem(BADGE_STORAGE_KEY);

    return normalizeKeys(JSON.parse(raw || "[]"));
  } catch {
    return [];
  }
}

function writeBadges(list) {
  const json = JSON.stringify(normalizeKeys(list));
  try { sessionStorage.setItem(BADGE_STORAGE_KEY, json); } catch (e) {}
  try { localStorage.setItem(BADGE_STORAGE_KEY, json); } catch (e) {}
}

async function clearAllProjectBadges() {
  try {
    sessionStorage.removeItem(BADGE_STORAGE_KEY);
    localStorage.removeItem(BADGE_STORAGE_KEY);

    const headers = {
      "Content-Type": "application/json",
      "x-user-email": userEmail   // 🔥 REQUIRED
    };

    await Promise.all([
      fetch("/api/removal-install/kv-set", {
        method: "POST",
        headers,
        body: JSON.stringify({ key: BADGE_KV_KEY, value: "[]" })
      }),
      fetch("/api/removal-install/kv-set", {
        method: "POST",
        headers,
        body: JSON.stringify({ key: UNREAD_KEY, value: 0 })
      }),
      fetch("/api/removal-install/kv-set", {
        method: "POST",
        headers,
        body: JSON.stringify({ key: UNREAD_IMAGES_KEY, value: 0 })
      }),

      // 🔥 iOS badge reset
      fetch("/api/removal-install/kv-set", {
        method: "POST",
        headers,
        body: JSON.stringify({
          key: `ios:badge:counter:${userEmail}`,
          value: 0
        })
      })
    ]);
  } catch (e) {
    console.warn("Badge clear failed", e);
  }
}
async function readBadgesFromKV() {
  try {
    const r = await fetch(
      `/api/removal-install/kv-get?key=${encodeURIComponent(BADGE_KV_KEY)}`,
      { headers: { "x-user-email": userEmail } }
    );
    const j = await r.json();
    if (!j || !j.value) return [];
    const parsed = Array.isArray(j.value) ? j.value : JSON.parse(j.value);
    return normalizeKeys(parsed);
  } catch (e) {
    return [];
  }
}

async function writeBadgesToKV(list) {
  try {
    await fetch("/api/removal-install/kv-set", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": userEmail
      },
      body: JSON.stringify({
        key: BADGE_KV_KEY,
        value: JSON.stringify(normalizeKeys(list || []))
      })
    });
  } catch (e) {}
}

/* ===============================
   EXIT CLEAR (NEW pill only)
   ONLY when leaving via back button to Management
=============================== */
(function installProjectDetailsExitClear() {
  let cleared = false;

  function clearOnce() {
    if (cleared) return;
    cleared = true;

    try {
      sessionStorage.removeItem(BADGE_STORAGE_KEY);
      localStorage.removeItem(BADGE_STORAGE_KEY);

      fetch("/api/removal-install/kv-set", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-user-email": userEmail
        },
        body: JSON.stringify({ key: BADGE_KV_KEY, value: "[]" }),
        keepalive: true
      });
    } catch (e) {}
  }

  document.addEventListener("DOMContentLoaded", function () {
    const backBtn = document.getElementById("backToManagement");
    if (backBtn) backBtn.addEventListener("click", clearOnce);
  });
})();
</script>

    <script>
        
function createDemoEmail() {
  const key = "espin_demo_email_inbox_v1";
  const context = window.EspinOperation?.context || {};

  const equipment = context.equipment_model || context.equipment || "MultiGreeb";
  const manufacturer = context.make || context.manufacturer || "OEM";
  const model = context.model || "1";
  const serial = context.serial_number || "W1234";

  const updatedFields = [];

  document.querySelectorAll(".field, .toggle").forEach(row => {
    const label = row.querySelector(".label")?.textContent.replace(/NEW/g,"").trim();
    const input = row.querySelector("input, textarea, select");
    if (!label || !input) return;

    const value = input.type === "checkbox"
      ? (input.checked ? "Completed" : "Not Completed")
      : String(input.value || "").trim();

    if (value) {
      updatedFields.push({
        section: row.closest(".group")?.querySelector(".group-title")?.textContent.trim() || "Project Update",
        field: label,
        value
      });
    }
  });

  const formatEmailDate = value => {
    if (!value) return "—";
    const d = new Date(String(value).replace(" ", "T"));
    if (isNaN(d)) return value;
    return d.toLocaleString("en-US", {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    });
  };

  const rows = items => items.map(row => `
    <div style="display:grid;grid-template-columns:50% 50%;padding:16px;border-bottom:1px solid #ddd;font-size:20px;">
      <div style="font-weight:700;">${row[0]}</div>
      <div style="font-weight:700;color:${row[1] !== "—" ? "#0b67b2" : "#222"};">${row[1]}</div>
    </div>`).join("");

  let updateHtml = "";
  const sections = {};
  updatedFields.forEach(f => (sections[f.section] ||= []).push(f));

  Object.entries(sections).forEach(([section, fields]) => {
    updateHtml += `
      <div style="background:#2167a5;color:white;padding:18px 26px;font-size:26px;font-weight:700;margin-top:30px;">
        ${section}
      </div>
      ${rows(fields.map(f => [
        f.field,
        /^\d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}/.test(String(f.value || ""))
          ? formatEmailDate(f.value)
          : f.value
      ]))}`;
  });

  const html = `
    <div style="font-family:Arial,sans-serif;color:#222;">
      <h1 style="font-size:34px;">Equipment Update: ${equipment}</h1>
      <div style="background:#2167a5;color:white;padding:18px 26px;font-size:26px;font-weight:700;">
        Equipment Update Details
      </div>
      ${rows([
        ["PET Manufacturer", manufacturer],
        ["PET Model", model],
        ["PET Serial", serial],
        ["PET Hard Drives Removed", "—"]
      ])}
      ${updateHtml}
    </div>`;

  const emails = JSON.parse(localStorage.getItem(key) || "[]");
  emails.unshift({
    id: Date.now().toString(),
    projectId: context.project_id || new URLSearchParams(location.search).get("projectId") || "demo-project",
    subject: `Equipment Update: ${equipment}`,
    from: "Espin Medical <info@espinmedical.com>",
    createdAt: new Date().toLocaleString(),
    html
  });

  localStorage.setItem(key, JSON.stringify(emails));
}
var formData = {};
        var dirtyFields = new Set();

        function showConfirm(message, onOk, onCancel) {
            const overlay = document.getElementById("confirmOverlay");
            document.getElementById("confirmText").textContent = message;
            overlay.style.display = "flex";
            document.getElementById("confirmOk").onclick = () => { overlay.style.display = "none"; if (onOk) onOk(); };
            document.getElementById("confirmCancel").onclick = () => { overlay.style.display = "none"; if (onCancel) onCancel(); };
        }

        function applyChangedHighlightsOnce(fields){
            var missing = [];
            fields.forEach(key => {
                var el = document.querySelector('[data-key="' + key + '"]');
                if (!el) { missing.push(key); return; }
                el.classList.add("field-updated");
                var label = el.querySelector(".label");
                if (label && !label.querySelector(".new-pill")) {
                    var p = document.createElement("span");
                    p.className = "new-pill"; p.textContent = "NEW";
                    label.appendChild(p);
                }
            });
            return missing;
        }

        function applyChangedHighlightsWithRetry(fields, attemptsLeft = 12){
            fields = normalizeKeys(fields);
            if (!fields.length) return;
            setTimeout(() => {
                var missing = applyChangedHighlightsOnce(fields);
                if (missing.length && attemptsLeft > 0) applyChangedHighlightsWithRetry(missing, attemptsLeft - 1);
            }, 50);
        }

        function input(label, key, val, type = "datetime-local") {
            var d = document.createElement("div");
            d.className = "field"; d.dataset.key = key;
            d.innerHTML = '<div class="label">' + label + "</div>";
            var i = document.createElement("input");
            i.type = type;
            if (val) {
                if (type === "datetime-local") {
                    var v = String(val).replace(" ", "T").slice(0, 16);
                    i.value = v; formData[key] = v.replace("T", " ") + ":00";
                } else {
                    i.value = val; formData[key] = val;
                }
            }
            function recordInputValue() {
                formData[key] = (type === "datetime-local" && i.value)
                    ? i.value.replace("T", " ") + ":00"
                    : i.value;
                dirtyFields.add(key);
            }
            // Native date/time pickers do not consistently emit input on every
            // platform, so listen for both events before saving or navigating.
            i.addEventListener("input", recordInputValue);
            i.addEventListener("change", recordInputValue);
            d.appendChild(i);
            return d;
        }

        function toggle(label, key, val, customOnChange) {
            var d = document.createElement("div");
            d.className = "toggle"; d.dataset.key = key;
            var l = document.createElement("div");
            l.className = "label"; l.textContent = label;
            var c = document.createElement("input");
            c.type = "checkbox"; c.checked = !!val;
            if (!!val) { d.classList.add("locked"); c.disabled = true; }
            d.onclick = function(e) { if (d.classList.contains("locked")) return; if (e.target !== c) c.click(); };
            c.onchange = function() {
                if (typeof customOnChange === "function") { customOnChange(c); }
                else { formData[key] = c.checked; dirtyFields.add(key); if (c.checked) { d.classList.add("locked"); c.disabled = true; } }
            };
            d.appendChild(l); d.appendChild(c);
            return d;
        }

        function group(title) {
            var g = document.createElement("div");
            g.className = "group"; g.innerHTML = '<div class="group-title">' + title + "</div>";
            return g;
        }

<script>
async function load() {
    try {
        var res = await fetch("/api/removal-install/project-details?projectId=" + encodeURIComponent(projectId));
        var d = await res.json();

        const projectArchived =
            (
                d.project_completed === true ||
                d.project_completed === "true" ||
                d.project_completed === 1 ||
                d.project_completed === "1"
            ) &&
            !!String(d.project_completion || "").trim() &&
            !!String(d.project_completed_by || d.projected_completed_by || "").trim();

        /* ───────── PROJECT COMPLETION ───────── */
        var g6 = group("Project Completion");

var completionDate = input(

);

function applyLockStyle(el) {

    el.style.color = "#666";

// Completed By remains editable until the entire project is archived.

var completedToggle = toggle(
    "Project Completed",
    "project_completed",
    window.__projectCompletedFromServer,
    function (cb) {
        if (!cb.checked || formData.project_completed) return;

        cb.checked = false;

        showConfirm(

            () => {

                formData.project_completed = true;
                dirtyFields.add("project_completed");

                formData.project_completed_by = completedByInput.value || "";
                formData.project_completion = completionInput.value || "";

                // 🔥 DO NOT await

                    },

                    })

                cb.checked = true;

);

function reevaluateGate() {
    var tgl = completedToggle.querySelector("input");

    if (window.__projectCompletedFromServer) {
        tgl.checked = true;

        completedToggle.classList.add("locked");

    var isReady =
        completedByInput.value.trim() !== "" &&

    completedToggle.classList.toggle("disabled-checked", !isReady);
    tgl.disabled = !isReady;
}

completedByInput.addEventListener("input", reevaluateGate);
completedByInput.addEventListener("blur", reevaluateGate);
completionInput.addEventListener("input", reevaluateGate);
completionInput.addEventListener("change", reevaluateGate);

reevaluateGate();

g6.appendChild(completionDate);
g6.appendChild(completedBy);

fc.appendChild(g6);
        /* ───────── NOTES ───────── */
        var gn = group("Notes");

        nf.appendChild(tx);

        /* ───────── BADGES ───────── */
        var badges = readBadges();
        if (!badges.length) {

            if (badges.length) writeBadges(badges);

        applyChangedHighlightsWithRetry(badges);

        /* ───────── ARCHIVE LOCK ───────── */
        if (window.__projectCompletedFromServer) {
            document.getElementById("archiveBanner").style.display = "block";
            document.querySelector(".project-action-buttons").style.display = "none";

            document.querySelectorAll("input, textarea").forEach(el => {
                el.disabled = true;
                el.style.backgroundColor = "#f2f2f2";
                el.style.color = "#333";
                el.style.opacity = "1";
                el.style.webkitTextFillColor = "#333";
                el.style.cursor = "not-allowed";
            });

            document.querySelectorAll(".toggle").forEach(t => t.classList.add("locked"));
        }

    } catch (e) {
        document.getElementById("form-container").innerHTML = "Error loading project details.";
    }
}

load();

    <script>

const ESPIN_ACTIVE_PROJECTS_KEY = "espin_active_project_progress_v1";

function buildRemovalExecutiveMilestones(data) {
  const hasValue = value =>
    value !== undefined &&
    value !== null &&
    String(value).trim() !== "";

  const isChecked = value =>
    value === true ||
    value === "true" ||
    value === 1 ||
    value === "1";

  const milestone = (name, completed) => ({
    name,
    completed: Boolean(completed),
    completed_at: completed ? new Date().toISOString() : ""
  });

  // Every visible Project Details field contributes one equal progress step.
  // 18 saved steps means approximately 5.56% per completed field.
  return [
    milestone("Project Start Date Entered", hasValue(data?.project_start)),
    milestone("Pathways Opening Date Entered", hasValue(data?.pathways_opening_start)),
    milestone("Pathways Opened", isChecked(data?.pathways_opened)),
    milestone("Inspection Date Entered", hasValue(data?.inspection_date)),
    milestone("Inspection Completed", isChecked(data?.inspection_completed)),

    milestone("Power Shut Down Date Entered", hasValue(data?.power_shutdown)),
    milestone("Power Completed", isChecked(data?.power_shutdown_completed)),

    milestone(
      data?.magnet_event === "quench"
        ? "Quench Date Entered"
        : "Ramp Down Date Entered",
      data?.magnet_event === "quench"
        ? hasValue(data?.magnet_quench_date)
        : hasValue(data?.magnet_ramp_down)
    ),
    milestone(
      data?.magnet_event === "quench"
        ? "Quench Completed"
        : "Ramp Down Completed",
      data?.magnet_event === "quench"
        ? isChecked(data?.magnet_quench_completed)
        : isChecked(data?.magnet_ramp_completed)
    ),

    milestone("De-Install Start Date Entered", hasValue(data?.deinstall_start)),
    milestone("De-Install Completed", isChecked(data?.deinstall_completed)),
    milestone("Rig-Out Date Entered", hasValue(data?.rigout_date)),
    milestone("Rig-Out Completed", isChecked(data?.rigout_completed)),

    milestone(
      "Disposal Date Entered",
      data?.disposal_required
        ? hasValue(data?.disposal_date)
        : true
    ),
    milestone(
      "Disposal Completed",
      data?.disposal_required
        ? isChecked(data?.disposal_completed)
        : true
    ),

    milestone("Project Completion Date Entered", hasValue(data?.project_completion)),
    milestone("Completed By Entered", hasValue(data?.project_completed_by || data?.projected_completed_by)),
    milestone("Project Completed", isChecked(data?.project_completed))
  ];
}

function syncRemovalProjectToRep(data) {
  const projectCompleted =
    data?.project_completed === true ||
    data?.project_completed === "true" ||
    data?.project_completed === 1 ||
    data?.project_completed === "1";

  let milestones = buildRemovalExecutiveMilestones(data || {});

  // Project Completed is the final authoritative milestone. Once checked,
  // every executive milestone is treated as completed and progress becomes 100%.
  if (projectCompleted) {
    const completedAt = new Date().toISOString();
    milestones = milestones.map(milestone => ({
      ...milestone,
      completed: true,
      completed_at: milestone.completed_at || completedAt
    }));
  }

  const completed = milestones.filter(m => m.completed).length;
  const progress = projectCompleted
    ? 100
    : Math.round(completed / milestones.length * 100);
  const next = milestones.find(m => !m.completed);
  const latestCompleted = [...milestones].reverse().find(m => m.completed);
  const project = {
    project_id:String(projectId || data?.project_id || "REMOVAL-PROJECT"),
    operation_id:window.EspinOperation.context.operation_id,
    operation_type:"deinstall",
    project_group_id:window.EspinOperation.context.project_group_id,
    source_record_id:window.EspinOperation.context.source_record_id,
    facility_id:window.EspinOperation.context.facility_id,
    asset_id:window.EspinOperation.context.asset_id,
    serial_number:window.EspinOperation.context.serial_number,
    project_name:data?.project_name || data?.name || data?.equipment || "Removal Project",
    project_type:"removal",
    facility:window.EspinOperation.context.facility || data?.facility || data?.site_name || data?.hospital || "ESPIN Connect",
    equipment_model:window.EspinOperation.context.equipment_model || data?.equipment_model || data?.model || "",
    current_stage:progress >= 100
      ? "Project Completed"
      : (latestCompleted?.name || next?.name || "Project Started"),
    progress,
    milestones,
    updated_at:new Date().toISOString(),
    project_url:location.href
  };

  const savedProject = window.EspinOperation.upsertActiveProject(project);

  // Send the updated progress directly to the Rep page even when ESPIN
  // Connect and ESPIN LINK are hosted on different domains.
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(
        {
          type: "ESPIN_ACTIVE_PROJECT_UPDATED",
          project: savedProject
        },
        "*"
      );
    }
  } catch (error) {
    console.warn("Rep progress message could not be delivered.", error);
  }

  return savedProject;
}

async function saveData(continueToImages = false) {
  console.log("🔥 SAVE CLICKED");

  const btn = document.getElementById(continueToImages ? "continueToImagesBtn" : "sendUpdateBtn");
  btn.disabled = true;
  btn.innerText = "Saving...";

  let isArchivingNow = false;

  const fieldsBeingSaved = new Set(dirtyFields);
  const payload = {};
  fieldsBeingSaved.forEach(k => (payload[k] = formData[k]));

  if (formData.project_completed_by) {
    payload.project_completed_by = formData.project_completed_by;
  }

  if (window.__completionTriggered === true) {
    payload.project_completed = true;
    payload.project_completed_by = formData.project_completed_by || "";
    payload.project_completion = formData.project_completion || "";
  }

  if (!Object.keys(payload).length) {
    payload.notes = formData.notes || "No changes";
  }

  const isCompletionFlow = window.__completionTriggered === true;

  try {
    const res = await fetch("/api/removal-install/project-details", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": userEmail
      },
      body: JSON.stringify({ projectId, data: payload })
    });

    const result = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(result.error || "Project details could not be saved");

    // Preserve edits made while this request was in flight; clear only fields
    // that were included in the successful save.
    fieldsBeingSaved.forEach(k => dirtyFields.delete(k));

    const savedProjectSnapshot = syncRemovalProjectToRep({
      ...formData,
      ...payload
    });

    // Re-send after the successful API response so Rep reflects the exact
    // Save & Submit action rather than an unsaved checkbox click.
    try {
      if (window.opener && !window.opener.closed && savedProjectSnapshot) {
        window.opener.postMessage(
          {
            type: "ESPIN_ACTIVE_PROJECT_UPDATED",
            project: savedProjectSnapshot
          },
          "*"
        );
      }
    } catch (error) {
      console.warn("Saved removal progress was not delivered to Rep.", error);
    }

    const archiveNow =
      payload.project_completed === true &&
      String(payload.project_completed_by || "").trim() !== "" &&
      String(payload.project_completion || "").trim() !== "";

    if (archiveNow && window.__projectCompletedFromServer === false) {
      isArchivingNow = true;
      await clearAllProjectBadges();
      window.__projectCompletedFromServer = true;
    }

    if (!isArchivingNow && !isCompletionFlow && !continueToImages) {
      const existing = readBadges();
      const serverChanged = normalizeKeys((result && result.changedFields) || []);

      const fieldsToNotify = serverChanged.length ? serverChanged : Object.keys(payload);

      serverChanged.forEach(k => {
        if (!existing.includes(k)) existing.push(k);
      });

      writeBadges(existing);
      await writeBadgesToKV(existing);
      applyChangedHighlightsWithRetry(existing);

      await fetch("/api/removal-install/sandbox-send-project-emails", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-user-email": userEmail
        },
        body: JSON.stringify({ projectId, changedFields: fieldsToNotify })
      });
    }

    btn.innerText = isArchivingNow ? "✓ Archived" : "✓ Success";
    btn.classList.add("success");

    if (isArchivingNow) {
      setTimeout(() => location.reload(), 800);
    } else if (continueToImages) {
      location.href = window.EspinOperation.url(`RemovalProjectImages.html?id=${encodeURIComponent(projectId)}`);
    } else {
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove("success");
        btn.innerText = "Send Project Update Only";
      }, 2000);
    }

  } catch (e) {
    console.error("❌ SAVE ERROR:", e);
    btn.disabled = false;
    btn.innerText = "Error. Try again.";
  }
}
</script>

/* =========================================
   AUTO REFRESH WHEN APP RETURNS FROM PUSH
========================================= */

let espinLastRefresh = Date.now();

function espinAutoRefresh() {
  const now = Date.now();
  if (now - espinLastRefresh < 2000) return;
  espinLastRefresh = now;

  location.reload();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    espinAutoRefresh();
  }
});

window.addEventListener("focus", espinAutoRefresh);
window.addEventListener("pageshow", espinAutoRefresh);
</script>

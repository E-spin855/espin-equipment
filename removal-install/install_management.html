<script>
(() => {
  const email = String(
    localStorage.getItem("espinUserEmail") ||
    localStorage.getItem("espinEquipment_userEmail") ||
    "info@espinmedical.com"
  ).toLowerCase().trim();
  localStorage.setItem("espinAuth", "true");
  localStorage.setItem("espinUserEmail", email);
})();
</script>

<style>
:root{
  --bg:#020b18;
  --panel:#061321;
  --panel2:#081827;
  --cyan:#16d9ff;
  --cyan-soft:#0a86ad;
  --cyan-line:rgba(22,217,255,.54);
  --text:#f4f8fc;
  --muted:#95aec1;
  --green:#22e65f;
  --red:#ff3b30;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;overscroll-behavior:none}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(0,115,180,.14),transparent 38%),
    linear-gradient(180deg,#020916 0%,#010813 100%);

}
.header{
  width:min(1540px,94vw);
  margin:30px auto 18px;
  min-height:80px;
  display:flex;
  align-items:center;
  position:relative;
  background:transparent;
  color:#fff;
}
.header a{
  position:static;
  transform:none;
  width:70px;height:64px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--cyan);

  color:var(--cyan);

  line-height:1;

}
.header a:active{transform:translateY(2px);box-shadow:inset 0 3px 7px rgba(0,0,0,.55),0 0 10px rgba(22,217,255,.12)}
.header h1{
  margin:0 0 0 38px;
  font-size:clamp(30px,3vw,44px);
  font-weight:800;
  letter-spacing:-.03em;
  text-align:left;
}
#projectName{opacity:0;transition:opacity .15s ease}
.container{
  position:relative;
  width:min(1540px,94vw);
  max-width:none;
  margin:0 auto;
  padding:30px 32px 34px;
  border:1px solid var(--cyan-line);
  background:linear-gradient(180deg,rgba(4,17,31,.86),rgba(2,12,23,.94));
  box-shadow:0 20px 55px rgba(0,0,0,.38), inset 0 0 45px rgba(0,104,155,.025);
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
}
.container:before,.container:after{content:"";position:absolute;pointer-events:none;z-index:5}
.container:before{left:20px;right:20px;top:0;height:3px;background:linear-gradient(90deg,transparent 0%,rgba(22,217,255,.65) 6%,rgba(22,217,255,.9) 50%,rgba(22,217,255,.65) 94%,transparent 100%);box-shadow:0 0 10px rgba(22,217,255,.38)}
.container:after{inset:12px;border:1px solid rgba(22,217,255,.12);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
.container.flash-once .top-scan-flare{animation:topScanOnce 1.25s cubic-bezier(.22,.65,.35,1) 1 both}
.top-scan-flare{position:absolute;z-index:8;top:-5px;left:20px;width:120px;height:11px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),var(--cyan),transparent);filter:blur(.2px);box-shadow:0 0 10px var(--cyan),0 0 24px rgba(22,217,255,.78)}
@keyframes topScanOnce{0%{left:20px;opacity:0}10%{opacity:1}85%{opacity:1}100%{left:calc(100% - 140px);opacity:0}}
.archive-banner{position:relative;z-index:10;margin:0 0 22px;padding:13px 16px;border:1px solid rgba(255,194,72,.45);border-radius:8px;background:rgba(93,58,4,.22);color:#ffd77c;font-weight:800;display:none;align-items:center;gap:10px}
.teams-grid{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.team-panel{border:1px solid rgba(22,217,255,.48);background:linear-gradient(180deg,rgba(3,15,27,.82),rgba(2,11,21,.94));padding:30px 32px 34px;min-width:0}
.section-title{margin:0 0 24px;padding:0 0 22px;border-bottom:1px solid rgba(22,217,255,.46);font-size:clamp(27px,2.2vw,38px);line-height:1;font-weight:850;letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.section-title:before{content:"♙";color:var(--cyan);font-size:.9em;font-weight:500;filter:drop-shadow(0 0 7px rgba(22,217,255,.35))}
.person-block{margin-top:0}
.row{height:82px;display:grid;grid-template-columns:minmax(170px,.42fr) 1fr;align-items:center;margin:0 0 26px;background:linear-gradient(90deg,rgba(10,26,42,.84),rgba(8,21,35,.76));border:1px solid rgba(255,255,255,.025);border-radius:5px;padding:0 24px}
.sub{font-size:clamp(18px,1.5vw,24px);font-weight:850;color:var(--cyan);text-transform:uppercase;letter-spacing:.04em}
.value{font-size:clamp(20px,1.5vw,25px);font-weight:750;color:#fff;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-actions{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.btn{position:relative;width:100%;min-height:92px;margin:0;padding:16px 22px;border:1px solid var(--cyan);border-radius:7px;color:#fff;font-size:clamp(18px,1.55vw,25px);font-weight:850;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(180deg,#0b4f83 0%,#08365e 46%,#061e38 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -7px 12px rgba(0,0,0,.28),0 8px 0 #031523,0 13px 24px rgba(0,0,0,.42),0 0 18px rgba(22,217,255,.18);text-shadow:0 1px 2px #000;transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.14);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -7px 12px rgba(0,0,0,.25),0 8px 0 #031523,0 15px 30px rgba(0,0,0,.48),0 0 25px rgba(22,217,255,.30)}
.btn:active{transform:translateY(6px);box-shadow:inset 0 3px 9px rgba(0,0,0,.4),0 2px 0 #031523,0 6px 12px rgba(0,0,0,.35),0 0 14px rgba(22,217,255,.22)}
.btn.secondary{background:linear-gradient(180deg,#0b4f83 0%,#08365e 46%,#061e38 100%)}
.btn.disabled{background:linear-gradient(#59636b,#434b51)!important;color:#b7bec4!important;border-color:#65727c!important;box-shadow:none!important;cursor:not-allowed;pointer-events:none}
.primary-actions{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:36px}
.primary-actions .btn{min-height:112px;font-size:clamp(22px,1.8vw,29px);text-transform:uppercase}
#detailsBtn{border-color:#20f05a;background:linear-gradient(180deg,#087c31 0%,#055821 48%,#033c18 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.17),inset 0 -8px 14px rgba(0,0,0,.3),0 8px 0 #012c11,0 13px 26px rgba(0,0,0,.44),0 0 22px rgba(32,240,90,.24)}
#detailsBtn:hover{box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -8px 14px rgba(0,0,0,.25),0 8px 0 #012c11,0 15px 31px rgba(0,0,0,.5),0 0 28px rgba(32,240,90,.38)}
#detailsBtn:active{transform:translateY(6px);box-shadow:inset 0 4px 10px rgba(0,0,0,.42),0 2px 0 #012c11,0 6px 12px rgba(0,0,0,.35),0 0 16px rgba(32,240,90,.28)}
.project-admin-actions{position:relative;z-index:3;display:flex;justify-content:center;gap:22px;margin:30px auto 0;max-width:980px}.project-admin-actions .btn{flex:1 1 0;max-width:470px;min-height:74px;margin:0}@media(max-width:700px){.project-admin-actions{flex-direction:column;gap:16px}.project-admin-actions .btn{max-width:none}}
.badge-dot{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:#d51f26;color:#fff;font-size:12px;font-weight:900;padding:6px 11px;border-radius:999px;display:none;line-height:1;letter-spacing:.05em;box-shadow:0 0 14px rgba(255,59,48,.35)}
.nav{width:min(1540px,94vw);margin:16px auto 0;position:static;display:flex;justify-content:center;gap:12px;background:transparent;border:0;padding:0;z-index:2}
.nav a{flex:0 0 auto;min-width:150px;padding:11px 18px;border:1px solid rgba(22,217,255,.24);border-radius:7px;background:rgba(4,18,31,.75);color:#91a9bb!important;font-size:12px;font-weight:700!important;text-align:center;text-decoration:none}
.nav a:hover{color:#fff!important;border-color:rgba(22,217,255,.6)}
@media(max-width:900px){.header{margin-top:18px}.container{padding:22px 18px}.teams-grid,.primary-actions{grid-template-columns:1fr}.team-panel{padding:24px 20px}.team-actions{gap:14px}.row{grid-template-columns:1fr;height:auto;gap:8px;padding:18px}.value{text-align:left}.btn{min-height:76px}.primary-actions .btn{min-height:86px}}
@media(max-width:560px){body{padding-bottom:30px}.header{width:92vw}.header a{width:54px;height:52px;font-size:38px}.header h1{margin-left:18px;font-size:25px}.container{width:94vw}.team-actions{grid-template-columns:1fr}.section-title{font-size:24px}.primary-actions{gap:16px;margin-top:22px}.nav{width:94vw}.nav a{min-width:0;flex:1}}
</style>
<link rel="stylesheet" href="field-command-theme.css">
</head>

<body>
<div class="header">
  <a href="install-projects.html" onclick="localStorage.removeItem('activeProjectId')">←</a>
  <h1 id="projectName"></h1>
</div>

<div class="container" id="managementFrame">
  <div class="top-scan-flare" aria-hidden="true"></div>
  <div id="archiveBanner" class="archive-banner">🔒 Project archived (Read-Only)</div>

  <div class="teams-grid">
    <section class="team-panel">
      <div class="section-title">Project Team</div>
      <div class="person-block">
        <div class="row"><div class="sub">Project Manager</div><div id="pmName" class="value">—</div></div>
        <div class="team-actions">
          <button class="btn" id="callPmBtn">📞 Call PM</button>
          <button class="btn secondary" id="textPmBtn">💬 Text PM</button>
        </div>
      </div>
    </section>

    <section class="team-panel">
      <div class="section-title">De-Installation Team</div>
      <div class="person-block">
        <div class="row"><div class="sub">Team Leader</div><div id="tlName" class="value">—</div></div>
        <div class="team-actions">
          <button class="btn" id="callTlBtn">📞 Call Leader</button>
          <button class="btn secondary" id="textTlBtn">💬 Text Leader</button>
        </div>
      </div>
    </section>
  </div>

  <div class="primary-actions">
    <button class="btn" id="detailsBtn">⚡ Project Details <span id="detailsBadge" class="badge-dot">NEW</span></button>
    <button class="btn secondary" id="imagesBtn">🖼 Project Images <span id="imagesBadge" class="badge-dot">NEW</span></button>
  </div>
  <div class="project-admin-actions">
    <button class="btn" id="manageUsersBtn" style="display:none;">👥 Add / Remove Users</button>
    <button class="btn" id="clearProjectBtn" style="display:none;background:linear-gradient(180deg,#a42b35,#66151d);border-color:#ff6974;">🗑 Clear Project</button>
  </div>
</div>

<div class="nav">
  <a href="../Rep.html">🔗<br>Espin Link</a>
  <a href="install-projects.html" style="color:var(--blue);font-weight:700;">🛠<br>Projects</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const urlProjectId = params.get("id") || params.get("projectId") || "";
  if (
    !urlProjectId &&
    (
      !window.EspinOperation.hasValidOperationId() ||
      !window.EspinOperation.hasReliableEquipmentId()
    )
  ) {
    const intake = new URL("EquipmentSelection_Install.html", location.href);
    intake.searchParams.set("operation_type", "install");
    location.replace(intake.toString());
    return;
  }
  const API_BASE = "";
  const ADMIN_EMAIL = "info@espinmedical.com";

  let userEmail = (localStorage.getItem("espinUserEmail") || "").toLowerCase().trim();

  if (!userEmail) {
    console.error("Missing user email");
    location.href = "install-projects.html";
    return;
  }

  const sandboxSession = (() => {
    try { return JSON.parse(sessionStorage.getItem("espinSandboxSession") || "null"); }
    catch (_) { return null; }
  })();
  const sandboxRole = String(window.ESPIN_SANDBOX?.role || sandboxSession?.role || "").toLowerCase();
  const sandboxActive = !sandboxSession?.expires_at || Date.parse(sandboxSession.expires_at) > Date.now();
  const isAdmin = userEmail === ADMIN_EMAIL || (sandboxActive && ["manager", "sandbox_admin"].includes(sandboxRole));

  const projectId =
    urlProjectId ||
    localStorage.getItem("activeProjectId");

  if (!projectId) {
    location.href = "install-projects.html";
    return;
  }

  localStorage.setItem("activeProjectId", projectId);

  const authHeaders = () => ({
    "Content-Type": "application/json",
    "x-user-email": userEmail
  });

  const manageBtn = document.getElementById("manageUsersBtn");
  const clearProjectBtn = document.getElementById("clearProjectBtn");
  const detailsBadge = document.getElementById("detailsBadge");
  const imagesBadge = document.getElementById("imagesBadge");

  let pmPhone = "";
  let tlPhone = "";
  let archiveCleanupDone = false;

  manageBtn.style.display = isAdmin ? "flex" : "none";
  manageBtn.onclick = () => {
    window.location.href = window.EspinOperation.url(`AdminProjectContacts_Install.html?id=${projectId}`);
  };

  clearProjectBtn.style.display = isAdmin ? "flex" : "none";
  clearProjectBtn.onclick = async () => {
    if (!confirm("Clear this Installation project and all of its details, images, and authorized users? This cannot be undone.")) return;
    clearProjectBtn.disabled = true;
    clearProjectBtn.textContent = "Clearing project…";
    try {
      const response = await fetch(`${API_BASE}/api/removal-install/projects`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ action: "delete", projectId })
      });
      if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || "Unable to clear project.");
      localStorage.removeItem("activeProjectId");
      localStorage.removeItem(`espin_project_operation_context:${projectId}`);
      localStorage.removeItem(`espin_operation_context:${projectId}`);
      location.href = "install-projects.html";
    } catch (error) {
      clearProjectBtn.disabled = false;
      clearProjectBtn.textContent = "🗑 Clear Project";
      alert(error.message || "Unable to clear project.");
    }
  };

  function makeCall(phone) {
    if (!phone) {
      alert("No phone number available");
      return;
    }
    window.location.href = `tel:${phone}`;
  }

  function sendText(phone) {
    if (!phone) {
      alert("No phone number available");
      return;
    }
    window.location.href = `sms:${phone}`;
  }

  async function clearProjectBadgesOnArchive(targetId) {
    if (archiveCleanupDone) return;
    archiveCleanupDone = true;

    try {
      await Promise.all([
        fetch(`${API_BASE}/api/removal-install/kv-set`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            key: `project:badges_details:${targetId}:${userEmail}`,
            value: "[]"
          })
        }),
        fetch(`${API_BASE}/api/removal-install/kv-set`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            key: `project:unread:${targetId}:${userEmail}`,
            value: 0
          })
        }),
        fetch(`${API_BASE}/api/removal-install/kv-set`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            key: `project:unread_images:${targetId}:${userEmail}`,
            value: 0
          })
        })
      ]);

      localStorage.removeItem(`badges_${targetId}`);
      sessionStorage.removeItem(`badges_${targetId}`);

      detailsBadge.style.display = "none";
      imagesBadge.style.display = "none";

      console.log("Archive cleanup complete.");
    } catch (e) {
      console.warn("Archive cleanup failed:", e);
    }
  }

  async function clearAndGo(url, type) {
    try {
      await fetch(`${API_BASE}/api/removal-install/project-mark-read`, {
        method: "POST",
        headers: {
          ...authHeaders(),
          "x-clear-source": "management"
        },
        body: JSON.stringify({
          projectId,
          type
        }),
        keepalive: true
      });
    } catch (e) {
      console.warn("mark-read failed:", e);
    }

    // The selected installation project is authoritative. Reapply its ID after
    // shared operation context is added so an older browser selection cannot
    // route Project Details to another project.
    const destination = new URL(window.EspinOperation.url(url), location.href);
    destination.searchParams.set("id", projectId);
    destination.searchParams.set("projectId", projectId);
    window.location.href = destination.toString();
  }

  document.getElementById("detailsBtn").onclick = () =>
    clearAndGo(`install_project_details.html?id=${projectId}`, "updates");

  document.getElementById("imagesBtn").onclick = () =>
    clearAndGo(`InstallProjectImages.html?id=${projectId}`, "images");

  async function loadData() {
    try {
      const pr = await fetch(`${API_BASE}/api/removal-install/projects?id=${projectId}`, {
        headers: {
          "x-user-email": userEmail
        }
      });

      if (pr.ok) {
        let p = await pr.json();
        if (Array.isArray(p)) p = p[0] || {};
        const isProjectOwner = String(p.admin_email || "").toLowerCase() === userEmail;
        manageBtn.style.display = (isAdmin || isProjectOwner) ? "flex" : "none";

        const title = document.getElementById("projectName");
        title.textContent = p.project_name || "";
        document.title = p.project_name || "";
        title.style.opacity = "1";

        if (p.project_completed) {
          document.getElementById("archiveBanner").style.display = "flex";

          ["callPmBtn", "textPmBtn", "callTlBtn", "textTlBtn"].forEach(id => {
            document.getElementById(id).classList.add("disabled");
          });

          clearProjectBadgesOnArchive(projectId);
        }
      }

      const cr = await fetch(`${API_BASE}/api/removal-install/project-contacts/management?projectId=${projectId}`, {
        headers: {
          "x-user-email": userEmail
        }
      });

      if (cr.ok) {
        const d = await cr.json();
        const contacts = Array.isArray(d.contacts) ? d.contacts : [];

        const pmData = contacts.find(c => c.role === "project_manager");
        const tlData = contacts.find(c => c.role === "team_leader");

        document.getElementById("pmName").textContent = pmData?.full_name || "—";
        document.getElementById("tlName").textContent = tlData?.full_name || "—";

        pmPhone = pmData?.phone || "";
        tlPhone = tlData?.phone || "";

        document.getElementById("callPmBtn").onclick = () => makeCall(pmPhone);
        document.getElementById("textPmBtn").onclick = () => sendText(pmPhone);
        document.getElementById("callTlBtn").onclick = () => makeCall(tlPhone);
        document.getElementById("textTlBtn").onclick = () => sendText(tlPhone);
      }

    } catch (e) {
      console.error("UI load failed:", e);
    }
  }

  async function loadBadges() {
    try {
      const [updateRes, imageRes] = await Promise.all([
        fetch(`${API_BASE}/api/removal-install/kv-get?key=${encodeURIComponent(`project:unread:${projectId}:${userEmail}`)}`, {
          headers: {
            "x-user-email": userEmail
          }
        }),
        fetch(`${API_BASE}/api/removal-install/kv-get?key=${encodeURIComponent(`project:unread_images:${projectId}:${userEmail}`)}`, {
          headers: {
            "x-user-email": userEmail
          }
        })
      ]);

      if (updateRes.ok) {
        const t = await updateRes.json();
        detailsBadge.style.display = Number(t.value || 0) > 0 ? "block" : "none";
      }

      if (imageRes.ok) {
        const i = await imageRes.json();
        imagesBadge.style.display = Number(i.value || 0) > 0 ? "block" : "none";
      }

    } catch (e) {
      console.warn("Badge check failed:", e);
    }
  }

  loadData();
  loadBadges();
});
</script>

<script>
let espinLastRefresh = Date.now();

function espinAutoRefresh() {
  const now = Date.now();

  if (now - espinLastRefresh < 2000) return;

  espinLastRefresh = now;
  location.reload();
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    espinAutoRefresh();
  }
});

window.addEventListener("focus", espinAutoRefresh);
window.addEventListener("pageshow", espinAutoRefresh);
</script>


<script>
(function(){
  const frame=document.getElementById("managementFrame");
  if(!frame)return;
  const key="espin_install_management_top_flash_seen_v1";
  if(sessionStorage.getItem(key)!=="1"){
    frame.classList.add("flash-once");
    sessionStorage.setItem(key,"1");
    window.setTimeout(()=>frame.classList.remove("flash-once"),1500);
  }
})();
</script>

<script id="espin-manager-solo-equipment-api-bridge">
(() => {
  const session = (() => {
    try { return JSON.parse(sessionStorage.getItem("espinSandboxSession") || "{}"); }
    catch (_) { return {}; }
  })();

  if (session?.manager_solo !== true) return;

  const nativeFetch = window.fetch.bind(window);

  const PROJECTS_KEY = "espin_solo_equipment_projects_v1";
  const DETAILS_KEY = "espin_solo_equipment_details_v1";
  const PHOTOS_KEY = "espin_solo_equipment_photos_v1";
  const KV_PREFIX = "espin_solo_equipment_kv:";

  const readArray = key => {
    try {
      const parsed = JSON.parse(localStorage.getItem(key) || "[]");
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  };

  const writeArray = (key, value) => {
    localStorage.setItem(
      key,
      JSON.stringify(Array.isArray(value) ? value : [])
    );
  };

  const jsonResponse = (body, status = 200) =>
    new Response(JSON.stringify(body), {
      status,
      headers: { "Content-Type": "application/json" }
    });

  const parseBody = init => {
    const raw = init?.body;
    if (!raw) return {};
    if (typeof raw === "string") {
      try { return JSON.parse(raw); } catch (_) { return {}; }
    }
    return {};
  };

  const projectIdOf = project =>
    String(project?.id || project?.project_id || project?.projectId || "").trim();

  const detailIdOf = row =>
    String(row?.modalityId || row?.modality_id || row?.id || "").trim();

  const photoIdOf = photo =>
    String(photo?.id || photo?.photoId || photo?.photo_id || "").trim();

  const getProjects = () => readArray(PROJECTS_KEY);
  const getDetails = () => readArray(DETAILS_KEY);
  const getPhotos = () => readArray(PHOTOS_KEY);

  const saveProject = payload => {
    const projects = getProjects();
    const id = String(payload?.id || "").trim() ||
      `SOLO-EQP-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;

    const index = projects.findIndex(project => projectIdOf(project) === id);
    const next = {
      ...(index >= 0 ? projects[index] : {}),
      ...payload,
      id,
      project_id:id,
      projectId:id,
      updated_at:new Date().toISOString(),
      created_at:
        (index >= 0 ? projects[index]?.created_at : "") ||
        payload?.created_at ||
        new Date().toISOString(),
      source:"manager_solo"
    };

    if (index >= 0) projects[index] = next;
    else projects.unshift(next);

    writeArray(PROJECTS_KEY, projects);
    return next;
  };

  const deleteProject = projectId => {
    const id = String(projectId || "");

    writeArray(
      PROJECTS_KEY,
      getProjects().filter(project => projectIdOf(project) !== id)
    );

    writeArray(
      DETAILS_KEY,
      getDetails().filter(row => String(row?.projectId || row?.project_id || "") !== id)
    );

    writeArray(
      PHOTOS_KEY,
      getPhotos().filter(photo => String(photo?.projectId || photo?.project_id || "") !== id)
    );
  };

  const saveDetail = payload => {
    const details = getDetails();
    const projectId = String(payload?.projectId || payload?.project_id || "").trim();
    const modality = String(payload?.modality || payload?.data?.modality || "").toUpperCase().trim();
    const requestedId = String(payload?.modalityId || payload?.modality_id || "").trim();
    const modalityId = requestedId ||
      `SOLO-MOD-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;

    const index = details.findIndex(row =>
      String(row?.projectId || row?.project_id || "") === projectId &&
      detailIdOf(row) === modalityId
    );

    const previousData =
      index >= 0 && details[index]?.data && typeof details[index].data === "object"
        ? details[index].data
        : {};

    const incomingData =
      payload?.data && typeof payload.data === "object"
        ? payload.data
        : {};

    const nextData = {
      ...previousData,
      ...incomingData,
      modality:modality || incomingData.modality || previousData.modality || ""
    };

    const changedFields = Object.keys(incomingData).filter(key =>
      JSON.stringify(previousData?.[key]) !== JSON.stringify(incomingData?.[key])
    );

    const next = {
      ...(index >= 0 ? details[index] : {}),
      id:modalityId,
      modalityId,
      modality_id:modalityId,
      projectId,
      project_id:projectId,
      modality:nextData.modality,
      data:nextData,
      updated_at:new Date().toISOString(),
      created_at:
        (index >= 0 ? details[index]?.created_at : "") ||
        new Date().toISOString(),
      source:"manager_solo"
    };

    if (index >= 0) details[index] = next;
    else details.unshift(next);

    writeArray(DETAILS_KEY, details);

    // Ensure a project shell exists so Equipment Projects / Equipment Records
    // can navigate the locally created Solo project.
    if (projectId && !getProjects().some(project => projectIdOf(project) === projectId)) {
      saveProject({
        id:projectId,
        project_name:
          localStorage.getItem("axis_parent_project_name") ||
          localStorage.getItem("axis_project_id") ||
          "Sandbox Equipment Project",
        sales_rep_first:localStorage.getItem("axis_sales_rep_first") || "Rep",
        sales_rep_last:localStorage.getItem("axis_sales_rep_last") || "1",
        sales_rep_company:localStorage.getItem("axis_sales_rep_company") || "OEM Demo",
        sales_rep_phone:"",
        sales_rep_email:localStorage.getItem("axis_sales_rep_email") || ""
      });
    }

    return { ...next, changedFields };
  };

  const savePhoto = payload => {
    const photos = getPhotos();
    const id = String(payload?.photoId || payload?.photo_id || payload?.id || "").trim() ||
      `SOLO-PHOTO-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;

    const index = photos.findIndex(photo => photoIdOf(photo) === id);

    const next = {
      ...(index >= 0 ? photos[index] : {}),
      ...payload,
      id,
      photoId:id,
      photo_id:id,
      projectId:String(payload?.projectId || (index >= 0 ? photos[index]?.projectId : "") || ""),
      modalityId:String(payload?.modalityId || (index >= 0 ? photos[index]?.modalityId : "") || ""),
      photo_url:
        payload?.photo_url ||
        payload?.url ||
        (index >= 0 ? photos[index]?.photo_url : "") ||
        "",
      created_at:
        (index >= 0 ? photos[index]?.created_at : "") ||
        payload?.created_at ||
        new Date().toISOString(),
      updated_at:new Date().toISOString(),
      source:"manager_solo"
    };

    if (index >= 0) photos[index] = next;
    else photos.unshift(next);

    writeArray(PHOTOS_KEY, photos);
    return next;
  };

  window.fetch = async (input, init = {}) => {
    let url;
    try {
      const raw = typeof input === "string" ? input : input?.url;
      url = new URL(raw, location.href);
    } catch (_) {
      return nativeFetch(input, init);
    }

    const path = url.pathname;
    const method = String(init?.method || "GET").toUpperCase();
    const body = parseBody(init);

    if (!path.startsWith("/api/")) {
      return nativeFetch(input, init);
    }

    if (path === "/api/kv-get") {
      const key = String(body.key || url.searchParams.get("key") || "");
      const value = localStorage.getItem(`${KV_PREFIX}${key}`);
      return jsonResponse({ value: value ?? "" });
    }

    if (path === "/api/kv-set") {
      const key = String(body.key || "");
      const value = body.value ?? "";
      localStorage.setItem(
        `${KV_PREFIX}${key}`,
        typeof value === "string" ? value : JSON.stringify(value)
      );
      return jsonResponse({ ok:true });
    }

    if (path === "/api/admin/equipment") {
      if (method === "GET") {
        return jsonResponse(getProjects());
      }

      if (method === "POST" || method === "PUT") {
        return jsonResponse(saveProject(body), method === "POST" ? 201 : 200);
      }
    }

    if (path === "/api/equipment-projects/proj-delete") {
      deleteProject(body.projectId || body.id);
      return jsonResponse({ ok:true });
    }

    if (
      path === "/api/equipment-project-mark-read" ||
      path === "/api/ios-clear-badge-equipment" ||
      path === "/api/badge-refresh-equipment"
    ) {
      return jsonResponse({ ok:true });
    }

    if (path === "/api/equipment-updates") {
      return jsonResponse({
        total:0,
        projects:{},
        details:{},
        images:{}
      });
    }

    if (path === "/api/equipment-details/equipment-save") {
      const saved = saveDetail(body);
      return jsonResponse({
        ok:true,
        modalityId:saved.modalityId,
        modality:saved.modality,
        data:saved.data,
        changedFields:saved.changedFields || []
      });
    }

    if (path === "/api/equipment-details") {
      const projectId = String(url.searchParams.get("projectId") || body.projectId || "");
      const modalityId = String(url.searchParams.get("modalityId") || body.modalityId || "");
      const modality = String(url.searchParams.get("modality") || body.modality || "").toUpperCase();

      let rows = getDetails().filter(row =>
        String(row?.projectId || row?.project_id || "") === projectId
      );

      if (modalityId) {
        rows = rows.filter(row => detailIdOf(row) === modalityId);
      } else if (modality) {
        rows = rows.filter(row => String(row?.modality || row?.data?.modality || "").toUpperCase() === modality);
      }

      const row = rows[0] || null;

      if (!row) {
        return jsonResponse({
          projectId,
          modalityId:modalityId || "",
          modality:modality || "",
          data:{}
        });
      }

      return jsonResponse(row);
    }

    if (path === "/api/equipment-details/list") {
      const projectId = String(url.searchParams.get("projectId") || "");
      const project =
        getProjects().find(item => projectIdOf(item) === projectId) ||
        {
          id:projectId,
          project_name:"Sandbox Equipment Project",
          site_address:"",
          zip_code:""
        };

      const modalities = getDetails()
        .filter(row => String(row?.projectId || row?.project_id || "") === projectId)
        .map(row => ({
          ...row,
          ...(row?.data && typeof row.data === "object" ? row.data : {})
        }));

      return jsonResponse({ project, modalities, items:modalities });
    }

    if (path === "/api/equipment-modalities/equipment-delete") {
      const projectId = String(body.projectId || "");
      const modalityId = String(body.modalityId || body.id || "");

      writeArray(
        DETAILS_KEY,
        getDetails().filter(row =>
          !(
            String(row?.projectId || row?.project_id || "") === projectId &&
            detailIdOf(row) === modalityId
          )
        )
      );

      writeArray(
        PHOTOS_KEY,
        getPhotos().filter(photo =>
          !(
            String(photo?.projectId || photo?.project_id || "") === projectId &&
            String(photo?.modalityId || photo?.modality_id || "") === modalityId
          )
        )
      );

      return jsonResponse({ ok:true });
    }

    if (path === "/api/equipment-photos/photo-list") {
      const modalityId = String(url.searchParams.get("modalityId") || "");
      const projectId = String(url.searchParams.get("projectId") || "");

      let photos = getPhotos();

      if (projectId) {
        photos = photos.filter(photo =>
          String(photo?.projectId || photo?.project_id || "") === projectId
        );
      }

      if (modalityId) {
        photos = photos.filter(photo =>
          String(photo?.modalityId || photo?.modality_id || "") === modalityId
        );
      }

      return jsonResponse(photos);
    }

    if (path === "/api/equipment-photos/photo-save") {
      return jsonResponse(savePhoto(body), 201);
    }

    if (path === "/api/equipment-photos/photo-update") {
      const photos = getPhotos();
      const photoId = String(body.photoId || body.id || "");
      const index = photos.findIndex(photo => photoIdOf(photo) === photoId);

      if (index >= 0) {
        photos[index] = {
          ...photos[index],
          ...body,
          updated_at:new Date().toISOString()
        };
        writeArray(PHOTOS_KEY, photos);
        return jsonResponse(photos[index]);
      }

      return jsonResponse({ ok:true });
    }

    if (path === "/api/equipment-photos/photo-delete") {
      const photoId = String(body.photoId || body.id || "");
      writeArray(
        PHOTOS_KEY,
        getPhotos().filter(photo => photoIdOf(photo) !== photoId)
      );
      return jsonResponse({ ok:true });
    }

    // Downloads are disabled in these sandbox pages; keep any accidental
    // API call from becoming a Solo 500.
    if (
      path === "/api/export-excel" ||
      path === "/api/export-package"
    ) {
      return jsonResponse({ ok:false, error:"Disabled for Sandbox test." }, 403);
    }

    return nativeFetch(input, init);
  };
})();
</script>

#projectList.list{

  margin:0 auto!important;

<script>
async function getChangedMap(projects) {
  const map = {};

  await Promise.all(
    projects.map(async (p) => {
      try {
        const r = await fetch("/api/kv-get", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            key: `equipment:changed:${p.id}`
          })
        });

        const json = await r.json().catch(() => ({}));

        if (!json?.value) {
          map[p.id] = { details: false, images: false };
          return;
        }

        const parsed = typeof json.value === "string"
          ? JSON.parse(json.value)
          : json.value;

        map[p.id] = {
          details: Array.isArray(parsed?.changedFields) && parsed.changedFields.length > 0,
          images: !!parsed?.hasImages
        };

      } catch {
        map[p.id] = { details: false, images: false };
      }
    })
  );

  return map;
}
const APP_PREFIX = "espinEquipment_";
const AUTH_KEY = `${APP_PREFIX}auth`;
const EMAIL_KEY = `${APP_PREFIX}userEmail`;
const PROJECT_ID_KEY = `${APP_PREFIX}activeProjectId`;
const MODALITY_KEY = `${APP_PREFIX}activeModality`;
const MODALITY_ID_KEY = `${APP_PREFIX}activeModalityId`;

const email = String(
  localStorage.getItem(EMAIL_KEY) ||
  localStorage.getItem("espinUserEmail") ||
  "info@espinmedical.com"
).toLowerCase().trim();
localStorage.setItem(AUTH_KEY, "true");
localStorage.setItem(EMAIL_KEY, email);

const ADMIN_EMAIL = "info@espinmedical.com";
const isAdmin = email === ADMIN_EMAIL;
const equipmentProjectsParams = new URLSearchParams(window.location.search);
const removalSelectionMode = equipmentProjectsParams.get("mode") === "removal-select";
const existingEquipmentTradeInMode =
  equipmentProjectsParams.get("existing_equipment_tradein") === "1";


let deleteBusy = false;
let pendingDeleteId = "";
let pendingDeleteName = "";
let unreadSummary = { total: 0, projects: {}, details: {}, images: {} };
let initialLoadDone = false;
let refreshBusy = false;
const selectedProjectIds = new Set();
let lastRenderedProjectIds = [];

function field(id) {
  return document.getElementById(id);
}
function resetProjectState(projectId) {
  localStorage.setItem(PROJECT_ID_KEY, projectId);
  localStorage.removeItem(MODALITY_KEY);
  localStorage.removeItem(MODALITY_ID_KEY);
  localStorage.removeItem(`${MODALITY_ID_KEY}_${projectId}`);
  localStorage.removeItem(`${MODALITY_KEY}_${projectId}`);
}

function redirectExistingEquipmentTradeInToDetails() {
  if (!existingEquipmentTradeInMode) return false;

  const projectId = String(
    equipmentProjectsParams.get("projectId") ||
    equipmentProjectsParams.get("id") ||
    ""
  ).trim();

  if (!projectId) return false;

  let handoff = {};
  try {
    handoff = JSON.parse(
      localStorage.getItem("axis_tradein_handoff_v1") || "{}"
    );
  } catch (_) {
    handoff = {};
  }

  const modality = String(
    equipmentProjectsParams.get("modality") ||
    handoff.modality ||
    handoff?.equipment_payload?.modality ||
    ""
  ).toUpperCase().trim();

  resetProjectState(projectId);

  if (modality) {
    localStorage.setItem(`${MODALITY_KEY}_${projectId}`, modality);
  }

  // Preserve the Rep-selected equipment handoff exactly as Equipment Details
  // expects it. Equipment Details already maps these values into its
  // modality-specific fields before the Rep continues to images/Trade Desk.
  const target = new URL(
    "/Equipment-Details.html",
    window.location.origin
  );

  target.searchParams.set("projectId", projectId);
  target.searchParams.set("source", "projects");
  target.searchParams.set("mode", "create");
  target.searchParams.set("handoff", "axis_tradein_handoff_v1");
  target.searchParams.set("existing_equipment_tradein", "1");

  if (modality) {
    target.searchParams.set("modality", modality);
  }

  [
    "axis_record_id",
    "axis_parent_record_id",
    "axis_project_id",
    "axis_serial_number",
    "axis_parent_project_type",
    "axis_parent_project_name",
    "axis_source",
    "sync_mode",
    "sales_rep_first",
    "sales_rep_last",
    "sales_rep_company",
    "sales_rep_phone",
    "sales_rep_email"
  ].forEach(key => {
    const value =
      equipmentProjectsParams.get(key) ||
      handoff[key] ||
      "";

    if (String(value).trim()) {
      target.searchParams.set(key, String(value));
    }
  });

  window.location.replace(target.toString());
  return true;
}

async function refreshEquipmentBadge(clearAll = false) {
  try {
    await fetch("/api/badge-refresh-equipment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": email
      },
      body: JSON.stringify({ email, clearAll })
    });
  } catch (e) {
    console.warn("refreshEquipmentBadge failed:", e);
  }
}

async function clearIosBadgeOnly() {
  try {
    await fetch("/api/ios-clear-badge-equipment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": email
      },
      body: JSON.stringify({ email }),
      keepalive: true
    });
  } catch (e) {
    console.warn("ios badge clear failed:", e);
  }
}

async function loadUnreadSummary() {
  try {
    const url = `/api/equipment-updates?t=${Date.now()}`;
    const r = await fetch(url, {
      method: "GET",
      cache: "no-store",
      headers: {
        "x-user-email": email,
        "Cache-Control": "no-cache"
      }
    });

    const out = await r.json().catch(() => ({}));

    if (!r.ok) {
      throw new Error(out?.error || "Failed to load unread summary");
    }

    unreadSummary = {
      total: Number(out?.total) || 0,
      projects: out?.projects && typeof out.projects === "object" ? out.projects : {},
      details: out?.details && typeof out.details === "object" ? out.details : {},
      images: out?.images && typeof out.images === "object" ? out.images : {}
    };
  
  } catch (e) {
    console.warn("loadUnreadSummary failed:", e);
    unreadSummary = { total: 0, projects: {}, details: {}, images: {} };
   
  }
}

function getProjectUnreadCount(projectId) {
  const projectCount = Number(unreadSummary?.projects?.[projectId]) || 0;

  const detailsCount = Object.entries(unreadSummary?.details || {}).reduce((sum, [key, value]) => {
    return key.startsWith(`${projectId}:`) ? sum + (Number(value) || 0) : sum;
  }, 0);

  const imageCount = Object.entries(unreadSummary?.images || {}).reduce((sum, [key, value]) => {
    return key.startsWith(`${projectId}:`) ? sum + (Number(value) || 0) : sum;
  }, 0);

  return projectCount + detailsCount + imageCount;
}

async function markProjectRead(projectId) {
  if (!projectId) return;

  try {
    const r = await fetch("/api/equipment-project-mark-read", {

        "x-user-email": email,
        "x-clear-source": "management"
      },
      body: JSON.stringify({
        projectId,
        type: "all",
        email
      }),
      keepalive: true
    });

    const out = await r.json().catch(() => ({}));

    if (!r.ok || out?.ok === false) {
      throw new Error(out?.error || "equipment-project-mark-read failed");
    }

    await refreshEquipmentBadge(false);
    await loadUnreadSummary();
    await loadProjects(true);
    await clearIosBadgeOnly();
  } catch (e) {
    console.warn("equipment mark-read failed:", e);
  }
}

async function clearTasksAndGoToDetails(projectId) {
  resetProjectState(projectId);
  await markProjectRead(projectId);

  // go to equipment list instead of forcing create
  window.location.href = `equipmentindex.html?projectId=${encodeURIComponent(projectId)}`;
}

function goToAddModality(projectId) {
  resetProjectState(projectId);

  // 🔴 force NEW equipment record
  const newId = crypto.randomUUID();

  localStorage.setItem(`${MODALITY_ID_KEY}_${projectId}`, newId);

  window.location.href =

}

async function goToEquipmentIndex(projectId) {
  resetProjectState(projectId);
  await markProjectRead(projectId);
  window.location.href = `equipmentindex.html?projectId=${encodeURIComponent(projectId)}`;
}

function selectTradeInProjectForRemoval(project) {
  let context = {};
  try { context = JSON.parse(localStorage.getItem("espin_removal_tradein_context_v1") || "{}"); } catch (_) {}
  localStorage.setItem("espin_removal_tradein_context_v1", JSON.stringify({
    ...context,
    tradein_project_id: project.id || "",
    tradein_project_name: project.project_name || "",
    facility_name: project.project_name || context.facility_name || "",
    site_address: project.site_address || "",
    city: project.city || "",

    zip_code: project.zip_code || ""
  }));
  window.location.href = `equipmentindex.html?projectId=${encodeURIComponent(project.id)}&mode=removal-select`;
}

function openProjectModal(p = null) {
  field("modalTitle").textContent = p ? "Edit Project" : "Add Project";
  field("editId").value = p?.id || "";
  field("inpName").value = p?.project_name || "";
  field("inpAddress").value = p?.site_address || "";
  field("inpCity").value = p?.city || "";
field("inpState").value = p?.state || "";
  field("inpZip").value = p?.zip_code || "";

  field("inpSalesFirst").value = p?.sales_rep_first || "";
  field("inpSalesLast").value = p?.sales_rep_last || "";
  field("inpSalesCompany").value = p?.sales_rep_company || "";
  field("inpSalesPhone").value = p?.sales_rep_phone || "";
  field("inpSalesEmail").value = p?.sales_rep_email || "";

  field("projectModal").style.display = "flex";
}

function closeProjectModal() {
  field("projectModal").style.display = "none";
}

function openDeleteModal(projectId, projectName) {
  pendingDeleteId = String(projectId || "").trim();
  pendingDeleteName = String(projectName || "").trim();
  field("deleteConfirmText").textContent =
    `Are you sure you want to delete "${pendingDeleteName || "this project"}"? This cannot be undone.`;
  field("deleteModal").style.display = "flex";
}

function closeDeleteModal() {
  field("deleteModal").style.display = "none";
  pendingDeleteId = "";
  pendingDeleteName = "";
}

async function saveProject() {
  const saveBtn = field("saveBtn");

  const id = field("editId").value.trim();
  const isEdit = !!id;

const payload = {
  id: id || undefined,
  project_name: field("inpName").value.trim(),
  site_address: field("inpAddress").value.trim(),
  city: field("inpCity").value.trim(),
  state: field("inpState").value.trim(), // ✅ THIS IS MISSING
  zip_code: field("inpZip").value.trim(),

  sales_rep_first: field("inpSalesFirst").value.trim(),
  sales_rep_last: field("inpSalesLast").value.trim(),
  sales_rep_company: field("inpSalesCompany").value.trim(),
  sales_rep_phone: field("inpSalesPhone").value.trim(),
  sales_rep_email: field("inpSalesEmail").value.trim()
};
  if (!payload.project_name) {
    alert("Site Name is required");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerText = "Saving...";

  try {
    const url = "/api/admin/equipment";

const r = await fetch(url, {
  method: isEdit ? "PUT" : "POST",
  cache: "no-store",
  headers: {
    "Content-Type": "application/json",
    "x-user-email": email
  },
  body: JSON.stringify({
    ...payload,
    id
  })
});

    const data = await r.json().catch(() => null);

    if (!r.ok || data?.error) {
      alert(data?.error || "Save failed");
      return;
    }

    closeProjectModal();

    if (!isEdit && data?.id) {
      resetProjectState(data.id);
      location.href = `Equipment-Details.html?projectId=${encodeURIComponent(data.id)}&source=projects&mode=create`;
      return;
    }

    await loadUnreadSummary();
    await loadProjects(true);

  } catch (e) {
    alert("Save failed");
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Project";
  }
}

async function deleteProject(projectId) {
  if (!projectId || deleteBusy) return;

  deleteBusy = true;
  const confirmBtn = field("confirmDeleteBtn");
  const oldText = confirmBtn.textContent;
  confirmBtn.disabled = true;
  confirmBtn.textContent = "Deleting...";

  try {
    const r = await fetch("/api/equipment-projects/proj-delete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-user-email": email
      },
      body: JSON.stringify({ projectId })
    });

    const data = await r.json().catch(() => ({}));

    if (!r.ok || data?.error) {
      throw new Error(data?.error || "Delete failed");
    }

    closeDeleteModal();
    await loadUnreadSummary();
    await loadProjects(true);

  } catch (e) {
    alert(`Delete failed: ${e?.message || e}`);
  } finally {
    deleteBusy = false;
    confirmBtn.disabled = false;
    confirmBtn.textContent = oldText;
  }
}

function bindSafeTap(element, handler) {
  if (!element) return;

  let touchHandled = false;

  element.addEventListener("touchend", (e) => {
    touchHandled = true;
    e.preventDefault();
    e.stopPropagation();
    handler(e);
    setTimeout(() => {
      touchHandled = false;
    }, 500);
  }, { passive: false });

  element.addEventListener("click", (e) => {
    if (touchHandled) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    handler(e);
  });
}

function updateBulkSelectionUi() {
  const toolbar = field("projectBulkToolbar");
  const selectAll = field("selectAllProjects");
  const deleteSelected = field("deleteSelectedProjects");
  const countLabel = field("selectedProjectCount");

  if (removalSelectionMode) {
    if (toolbar) toolbar.style.display = "none";
    return;
  }

  const renderedIds = lastRenderedProjectIds.filter(Boolean);
  const selectedVisible = renderedIds.filter(id => selectedProjectIds.has(id));

  if (countLabel) countLabel.textContent = `${selectedVisible.length} selected`;
  if (deleteSelected) deleteSelected.disabled = selectedVisible.length === 0 || deleteBusy;

  if (selectAll) {
    selectAll.checked =
      renderedIds.length > 0 &&
      selectedVisible.length === renderedIds.length;
    selectAll.indeterminate =
      selectedVisible.length > 0 &&
      selectedVisible.length < renderedIds.length;
  }
}

function toggleProjectSelection(projectId, checked) {
  const id = String(projectId || "").trim();
  if (!id) return;

  if (checked) selectedProjectIds.add(id);
  else selectedProjectIds.delete(id);

  updateBulkSelectionUi();
}

function toggleSelectAllProjects(checked) {
  lastRenderedProjectIds.forEach(id => {
    if (checked) selectedProjectIds.add(id);
    else selectedProjectIds.delete(id);
  });

  document.querySelectorAll(".project-select-toggle").forEach(input => {
    input.checked = checked;
  });

  updateBulkSelectionUi();
}

async function deleteSelectedProjects() {
  if (deleteBusy) return;

  const ids = lastRenderedProjectIds.filter(id => selectedProjectIds.has(id));
  if (!ids.length) return;

  const plural = ids.length === 1 ? "project" : "projects";
  if (!confirm(`Delete ${ids.length} selected ${plural}? This cannot be undone.`)) {
    return;
  }

  deleteBusy = true;
  const button = field("deleteSelectedProjects");
  const oldText = button?.textContent || "Delete Selected";

  if (button) {
    button.disabled = true;
    button.textContent = `Deleting ${ids.length}...`;
  }

  try {
    for (const projectId of ids) {
      const r = await fetch("/api/equipment-projects/proj-delete", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-user-email": email
        },
        body: JSON.stringify({ projectId })
      });

      const data = await r.json().catch(() => ({}));
      if (!r.ok || data?.error) {
        throw new Error(data?.error || `Delete failed for project ${projectId}`);
      }
    }

    ids.forEach(id => selectedProjectIds.delete(id));
    await loadUnreadSummary();
    await loadProjects(true);
  } catch (e) {
    alert(`Delete failed: ${e?.message || e}`);
  } finally {
    deleteBusy = false;
    if (button) button.textContent = oldText;
    updateBulkSelectionUi();
  }
}

async function loadProjects(forceFresh = false) {
  const list = field("projectList");

  try {
    const url = forceFresh
      ? `/api/admin/equipment?t=${Date.now()}`
      : "/api/admin/equipment";

    const r = await fetch(url, {
      cache: "no-store",
      headers: {
        "x-user-email": email,
        "Cache-Control": "no-cache"
      }
    });

    if (!r.ok) throw new Error("API error");

    const projects = await r.json();
const changedMap = isAdmin ? await getChangedMap(projects) : {};
    if (!Array.isArray(projects) || !projects.length) {
      lastRenderedProjectIds = [];
      selectedProjectIds.clear();
      list.innerHTML = "<p style='padding:20px'>No projects found</p>";
      updateBulkSelectionUi();
      return;
    }

    lastRenderedProjectIds = projects
      .map(project => String(project?.id || "").trim())
      .filter(Boolean);

    for (const selectedId of [...selectedProjectIds]) {
      if (!lastRenderedProjectIds.includes(selectedId)) {
        selectedProjectIds.delete(selectedId);
      }
    }

    list.innerHTML = "";

    for (const p of projects) {
const hasChangedDetails = changedMap[p.id]?.details;
const hasChangedImages = changedMap[p.id]?.images;
  const unreadCount = getProjectUnreadCount(p.id);

  const unreadData = Object.entries(unreadSummary?.details || {}).reduce((sum, [key, value]) => {
    return key.startsWith(`${p.id}:`) ? sum + (Number(value) || 0) : sum;
  }, 0);

  const unreadImages = Object.entries(unreadSummary?.images || {}).reduce((sum, [key, value]) => {
    return key.startsWith(`${p.id}:`) ? sum + (Number(value) || 0) : sum;
  }, 0);

  const card = document.createElement("div");
  card.className = removalSelectionMode ? "card" : "card has-project-select";

  card.innerHTML = `
  ${unreadCount > 0 ? `<div class="project-count-badge">${unreadCount}</div>` : ""}

  ${!removalSelectionMode ? `
    <label class="project-select-box" title="Select project">
      <input
        type="checkbox"
        class="project-select-toggle"
        data-select-project="${p.id}"
        ${selectedProjectIds.has(String(p.id)) ? "checked" : ""}
        aria-label="Select project"
      >
    </label>
  ` : ""}

  <div class="card-main">
    <h3>${p.project_name || ""}</h3>

    <p>${p.site_address || ""}</p>
    <p>
      ${(p.city || "")}${p.city ? ", " : ""}
      ${(p.state || "")} ${(p.zip_code || "")}
    </p>

    ${isAdmin ? `
      <div class="badge-wrap">
        ${!p.project_completed && hasChangedDetails ? `<span class="badge">⚡ NEW</span>` : ""}
        ${!p.project_completed && hasChangedImages ? `<span class="badge">🖼 NEW</span>` : ""}
      </div>
    ` : ""}
  </div>

  <div class="icon-row">
    <button type="button" class="icon-btn" data-edit="${p.id}">✏️</button>
    <button type="button" class="icon-btn delete-btn" data-delete="${p.id}">🗑</button>
  </div>
`;
  const main = card.querySelector(".card-main");
  const editBtn = card.querySelector(`[data-edit="${p.id}"]`);
  const deleteBtn = card.querySelector(`[data-delete="${p.id}"]`);
  const selectToggle = card.querySelector(`[data-select-project="${p.id}"]`);

  if (selectToggle) {
    selectToggle.addEventListener("click", event => {
      event.stopPropagation();
    });
    selectToggle.addEventListener("change", event => {
      event.stopPropagation();
      toggleProjectSelection(p.id, event.currentTarget.checked);
    });
  }

  if (removalSelectionMode) {
    const selectBtn = document.createElement("button");
    selectBtn.type = "button";
    selectBtn.className = "add-project-btn";
    selectBtn.textContent = "SELECT FOR REMOVAL";
    selectBtn.style.margin = "0 16px 16px";
    bindSafeTap(main, () => selectTradeInProjectForRemoval(p));
    bindSafeTap(selectBtn, () => selectTradeInProjectForRemoval(p));
    card.appendChild(selectBtn);
  } else {
    bindSafeTap(main, () => goToEquipmentIndex(p.id));
  }
  bindSafeTap(editBtn, () => openProjectModal(p));
  bindSafeTap(deleteBtn, () => openDeleteModal(p.id, p.project_name));

  list.appendChild(card);
}

    updateBulkSelectionUi();

  } catch (e) {
    console.warn("loadProjects failed:", e);
    list.innerHTML = "<p style='padding:20px'>Failed to load projects</p>";
  }
}
async function runInitialLoad() {
  if (initialLoadDone || refreshBusy) return;
  refreshBusy = true;

  try {
   
    await refreshEquipmentBadge(false);
    await loadUnreadSummary();
    await loadProjects(true);
    initialLoadDone = true;
  } catch (e) {
    console.warn("runInitialLoad failed:", e);
  } finally {
    refreshBusy = false;
  }
}

document.getElementById("confirmDeleteBtn").addEventListener("click", () => {
  if (!pendingDeleteId) return;
  deleteProject(pendingDeleteId);
});

document.getElementById("cancelDeleteBtn").addEventListener("click", () => {
  closeDeleteModal();
});

document.getElementById("deleteModal").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeDeleteModal();
});

field("selectAllProjects")?.addEventListener("change", event => {
  toggleSelectAllProjects(event.currentTarget.checked);
});

field("deleteSelectedProjects")?.addEventListener("click", () => {
  deleteSelectedProjects();
});

document.addEventListener("DOMContentLoaded", async () => {

  await runInitialLoad();

  if (redirectExistingEquipmentTradeInToDetails()) {
    return;
  }

  setInterval(async () => {

    try {

      await loadUnreadSummary();

      await loadProjects(true);

    } catch (e) {

      console.warn("Auto refresh failed:", e);

    }

  }, 5000);

});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESPIN LINK Demo Inbox</title>
<style>
body{margin:0;background:#f5f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#0f172a}
.header{background:#1F7BC8;color:white;padding:20px;font-size:22px;font-weight:800}
.wrap{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.08);margin-bottom:16px}
.meta{color:#64748b;margin-bottom:12px;font-size:18px}
.email-body{border-top:1px solid #ddd;padding-top:16px}
.empty{text-align:center;padding:40px;color:#64748b}
</style>
<style>#dailyBriefingBack{position:absolute;top:12px;right:20px;z-index:99999}#dailyBriefingBack .btn{min-height:36px;padding:9px 13px;border:1px solid #39d9ff;border-radius:8px;background:#06213a;color:#e9fbff;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}@media(max-width:640px){#dailyBriefingBack{position:static;margin:12px 16px;text-align:center}}</style></head>
<body><div id="dailyBriefingBack"><button class="btn" type="button" onclick="window.location.href='ESPIN_LINK_Fullscreen_Opening_Demo.html?view=briefing'">← GO BACK TO DAILY BRIEFING</button></div>
<div class="header">ESPIN LINK Demo Inbox</div>

<div class="wrap" id="container"></div>

<script>
const inboxKey = "espin_demo_email_inbox_v1";
const DEMO_EMAILS = [
  { subject:"Project review update", from:"Operations Desk", createdAt:"2026-08-22T09:15:00", body:"Hello,\n\nA project review has been updated in the demo workspace. Please review the current status and any follow-up date already recorded.\n\nThank you,\nOperations Desk" },
  { subject:"Quote activity received", from:"Commercial Support", createdAt:"2026-08-22T08:40:00", body:"Hello,\n\nA quote-related update has been added to the demo records. This message is for visibility only; no action is required from this inbox.\n\nCommercial Support" },
  { subject:"Daily briefing reminder", from:"ESPIN LINK Notifications", createdAt:"2026-08-22T08:00:00", body:"Good morning,\n\nYour Daily Briefing is ready. Calendar items and workspace updates appear in their respective demo views.\n\nESPIN LINK Notifications" }
];

const inboxChannel = typeof BroadcastChannel === "function"
  ? new BroadcastChannel("espin_demo_email_inbox")
  : null;

function formatEmailDate(value){
  if (!value) return "";
  const d = new Date(String(value).replace(" ", "T"));
  if (isNaN(d)) return value;
  return d.toLocaleString("en-US", {
    month:"short",
    day:"numeric",
    year:"numeric",
    hour:"numeric",
    minute:"2-digit",
    hour12:true
  });
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>\"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
  })[ch]);
}

function loadInbox(){
  const container = document.getElementById("container");
  let storedEmails = [];
  try { storedEmails = JSON.parse(localStorage.getItem(inboxKey) || "[]"); } catch (_) {}
  if (!Array.isArray(storedEmails)) storedEmails = [];
  const emails = [...storedEmails, ...DEMO_EMAILS];

  container.innerHTML = emails.map(email => `
    <div class="card">
      <h2 style="font-size:28px;">${escapeHtml(email.subject || "Equipment Update")}</h2>
      <div class="meta">
        <div style="font-size:20px;"><b>From:</b> ${escapeHtml(email.from || "Espin Medical")}<br>
        <b>Received:</b> ${formatEmailDate(email.createdAt)}</div>
      </div>
      <div class="email-body">
        ${email.html || escapeHtml(email.body || "").replace(/\n/g, "<br>")}
      </div>
    </div>
  `).join("");
}

loadInbox();

// Reflect inbox changes made by Reset Rep Actions without requiring a manual refresh.
window.addEventListener("storage", event => {
  if (event.key === inboxKey) loadInbox();
});
inboxChannel && (inboxChannel.onmessage = () => loadInbox());
window.addEventListener("pageshow", loadInbox);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Demo Customer Email</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--line:#d8e0e8;--text:#1f2933;--muted:#6b7280;--blue:#0066B2;--green:#1f9d63;--yellow:#d39d00}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:20px;font-weight:850;color:var(--blue)}
.sandbox{font-size:12px;font-weight:800;color:#745800;background:#fff4c4;border:1px solid #e1bc39;padding:7px 10px;border-radius:999px}
.wrap{max-width:980px;margin:28px auto;padding:0 18px}
.email{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden}
.head{padding:22px 24px;border-bottom:1px solid var(--line)}
.subject{font-size:24px;font-weight:800;margin-bottom:18px}
.addr{display:grid;grid-template-columns:56px 1fr;gap:6px 10px;font-size:14px;line-height:1.45}
.addr .k{color:var(--muted);font-weight:700}
.body{padding:28px 24px;white-space:pre-wrap;font-size:16px;line-height:1.65;min-height:300px}
.attach{margin:0 24px 26px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;display:flex;align-items:center;justify-content:space-between;gap:16px}
.attach strong{display:block;margin-bottom:3px}
.attach span{font-size:12px;color:var(--muted)}
.disabled{padding:8px 10px;border-radius:8px;background:#edf1f5;color:#7a8793;font-size:12px;font-weight:800;border:1px solid #d3dbe3}
.note{margin:0 24px 24px;padding:12px 14px;border:1px solid #f0d986;background:#fff9df;color:#6b5600;border-radius:10px;font-size:12px;line-height:1.45}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">ESPIN LINK · Demo Email</div>
  <div class="sandbox">SANDBOX ONLY · NOT SENT</div>
</div>
<div class="wrap">
  <div class="email" id="emailCard">
    <div class="empty">Loading demo email…</div>
  </div>
</div>
<script>
const INBOX_KEY="espin_demo_email_inbox_v1";
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function render(){
  let inbox=[];
  try{inbox=JSON.parse(localStorage.getItem(INBOX_KEY)||"[]")}catch(_){inbox=[]}
  if(!Array.isArray(inbox)) inbox=[];
  const msg=inbox[0];
  const card=document.getElementById("emailCard");
  if(!msg){card.innerHTML='<div class="empty">No demo customer email has been prepared yet.</div>';return}
  card.innerHTML=`
    <div class="head">
      <div class="subject">${esc(msg.subject||"Approved Quote")}</div>
      <div class="addr">
        <div class="k">From</div><div>${esc(msg.fromName||msg.from||"ESPIN LINK Rep")} &lt;${esc(msg.from||"rep@espinlink.sandbox")}&gt;</div>
        <div class="k">To</div><div>${esc(msg.to||"-")}</div>
        ${msg.cc?`<div class="k">CC</div><div>${esc(msg.cc)}</div>`:""}
      </div>
    </div>
    <div class="body">${esc(msg.body||"")}</div>
    <div class="attach">
      <div><strong>📎 ${esc(msg.attachmentName||"Approved_Quote.pdf")}</strong><span>Sandbox attachment representation only</span></div>
      <div class="disabled">DOWNLOAD DISABLED</div>
    </div>
    <div class="note">This page demonstrates what the customer email would look like. No external email is sent and no PDF attachment is downloadable in the sandbox.</div>
  `;
}
document.addEventListener("DOMContentLoaded",render);
window.addEventListener("storage",e=>{if(e.key===INBOX_KEY)render()});
try{new BroadcastChannel("espin_demo_email_inbox").addEventListener("message",render)}catch(_){}
</script>
</body>
</html>
